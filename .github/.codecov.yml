coverage:
  status:
    project:
      default:
        target: 35% # 全局覆盖率目标（可选）
        threshold: 1% # 允许下降的容忍度
        informational: false
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: false
comment:
  layout: "reach, diff, flags, files"
  behavior: new
  require_changes: false
codecov:
  notify:
    wait_for_ci: false
