name: Publish xpu wheel nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-all-${{ github.sha }}
  cancel-in-progress: true

env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  clone:
    name: Clone PaddleFleet
    uses: ./.github/workflows/_clone.yml
    with:
      clone_dir: $BRANCH
      ref: ${{ github.event.pull_request.base.ref }}

  publish-wheel-xpu:
    name: Publish xpu wheel nightly (${{ matrix.xpu.XPU_VERSION }}, python${{ matrix.python_version }})
    needs: clone
    if: github.repository == 'PaddlePaddle/PaddleFleet'
    runs-on:
      group: XPU-build
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10"]
        xpu:
          - {XPU_VERSION: xpu-p800, IMAGE_TAG: ci, bos_XPU: xpu-p800}
    env:
      TASK: PaddleFleet-nightly-${{ matrix.xpu.XPU_VERSION }}
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      UV_HTTP_TIMEOUT: 600
      no_proxy: ".bcebos.com,bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
    steps:
      - name: Check docker image and run container
        run: |
          docker_image="ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/fastdeploy-xpu:${{ matrix.xpu.IMAGE_TAG }}"
          docker pull $docker_image
          container_name=${TASK}-${{ matrix.python_version }}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker run -d -t --name ${container_name} \
            -v "/home/data/cfs:/home/data/cfs" \
            -v "/home/data/cfs/.cache:/home/.cache" \
            -v ${{ github.workspace }}/../../..:/root \
            -v ${{ github.workspace }}/../../../proxy:/root/proxy \
            -v ${{ github.workspace }}:/workspace \
            -e no_proxy \
            -e CACHE_DIR \
            -e PIP_CACHE_DIR \
            -e UV_HTTP_TIMEOUT \
            -e PR_ID \
            -e COMMIT_ID \
            -e BRANCH \
            -e AK=${{ secrets.BOS_CREDENTIAL_AK }} \
            -e SK=${{ secrets.BOS_CREDENTIAL_SK }} \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e GITHUB_REPO_NAME=${{ github.repository }} \
            -w /workspace --network=host $docker_image

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xc '
          rm -rf * .[^.]*
          source /root/proxy
          wget -q --tries=5 --no-proxy https://paddle-github-action.bj.bcebos.com/PaddleFleet/${BRANCH}/${PR_ID}/${COMMIT_ID}/PaddleFleet.tar.gz --no-check-certificate
          echo "Extracting PaddleFleet.tar.gz"
          tar -xf PaddleFleet.tar.gz --strip-components=1
          rm PaddleFleet.tar.gz
          git config --global --add safe.directory /workspace
          sed -i "s#packages/nightly/cu129#packages/nightly/${{ matrix.xpu.bos_XPU }}#g" pyproject.toml
          cat pyproject.toml
          # mkdir -p /root/.cache/pip
          # pip cache dir
          python -m pip install --upgrade pip
          python -m pip install bce-python-sdk==0.8.74
          python -m pip uninstall -y paddlepaddle-xpu fastdeploy-xpu paddlefleet
          python -m pip install --pre paddlepaddle-xpu -i https://www.paddlepaddle.org.cn/packages/nightly/xpu-p800
          '

      - name: Build wheel
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xc '
          source /root/proxy
          git submodule update --init --recursive
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "branch" ]]; then
            export PADDLEFLEET_VERSION=$(cat version.txt).post$(git log -1 --format=%cd --date=format:%Y%m%d)+$(git rev-parse --short=11 HEAD)
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            export PADDLEFLEET_VERSION=$VERSION
          fi
          export IS_XPU=1
          python -m pip wheel . --no-deps --no-build-isolation -w dist/
          '

      - name: Upload wheel
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xc '
          wget -q --no-proxy https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
          mkdir bos
          tar -xf bos_new.tar.gz -C bos
          cd dist
          git rev-parse HEAD > commitid
          if [[ "${{ github.event_name }}" != "push" ]]; then
            python ../bos/BosClient.py paddlefleet-*.whl paddle-whl/nightly/${{ matrix.xpu.bos_XPU }}/paddlefleet
            export AK=paddle
            export SK=paddle
            python ../bos/BosClient.py paddlefleet-*.whl paddle-github-action/PaddleFleet/${BRANCH}/${COMMIT_ID}/${{ matrix.xpu.bos_XPU }}
            PY_VERSION="${{ matrix.python_version }}"
            PY_VERSION_SHORT="${PY_VERSION//./}"
            mv paddlefleet-*.whl paddlefleet-0.0.0-cp${PY_VERSION_SHORT}-cp${PY_VERSION_SHORT}-linux_x86_64.whl
            python ../bos/BosClient.py paddlefleet-0.0.0-cp${PY_VERSION_SHORT}-cp${PY_VERSION_SHORT}-linux_x86_64.whl paddle-github-action/PaddleFleet/${BRANCH}/latest/${{ matrix.xpu.bos_XPU }}
            python ../bos/BosClient.py commitid paddle-github-action/PaddleFleet/${BRANCH}/latest/${{ matrix.xpu.bos_XPU }}
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            python ../bos/BosClient.py paddlefleet-*.whl paddle-whl/stable/${{ matrix.xpu.bos_XPU }}/paddlefleet
          else
            python ../bos/BosClient.py paddlefleet-*.whl paddle-whl/nightly/${{ matrix.xpu.bos_XPU }}/paddlefleet
            export AK=paddle
            export SK=paddle
            python ../bos/BosClient.py paddlefleet-*.whl paddle-github-action/PaddleFleet/${BRANCH}/${COMMIT_ID}/${{ matrix.xpu.bos_XPU }}
            PY_VERSION="${{ matrix.python_version }}"
            PY_VERSION_SHORT="${PY_VERSION//./}"
            mv paddlefleet-*.whl paddlefleet-0.0.0-cp${PY_VERSION_SHORT}-cp${PY_VERSION_SHORT}-linux_x86_64.whl
            python ../bos/BosClient.py paddlefleet-0.0.0-cp${PY_VERSION_SHORT}-cp${PY_VERSION_SHORT}-linux_x86_64.whl paddle-github-action/PaddleFleet/${BRANCH}/latest/${{ matrix.xpu.bos_XPU }}
            python ../bos/BosClient.py commitid paddle-github-action/PaddleFleet/${BRANCH}/latest/${{ matrix.xpu.bos_XPU }}
          fi
          curl https://www.paddlepaddle.org.cn/inner/whl/update/path/new
          '

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
