          coverage xml -o /workspace/PaddleFleet/coveragedata-multi-lora/coverage.xml
          coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: GLM4.5 dpo
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-dpo
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-dpo/.coverage
