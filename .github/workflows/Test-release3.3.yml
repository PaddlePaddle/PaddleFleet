name: Test-release3.3

on:
  pull_request:
    branches:
      - develop
      - release/**

permissions: read-all

concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  work_dir: /paddle
  PADDLE_ROOT: /paddle
  ci_scripts: /paddle/ci
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  CI_name: test
  no_proxy: "bcebos.com,.bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
  docker_image: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda129-coverage-test"

defaults:
  run:
    shell: bash

jobs:
  check-bypass:
    name: Check bypass
    if: ${{ inputs.can-skip != 'true' }}
    uses: ./.github/workflows/check-bypass.yml
    with:
      workflow-name: 'test-release'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}



  integration-test-H20-multi-card:
    needs: [check-bypass]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    name: Integration test (H20, multi-card)
    runs-on:
      group: Fleet-H-multi-card
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      TASK: paddlefleet-CI-${{ github.event.pull_request.number }}-integration-test-multi-card-release
    steps:
      - name: Check docker image and run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} --gpus all --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e PR_USER="${{ github.event.pull_request.user.login }}" \
            -e PP="rel" \
            -w /workspace --network host ${docker_image}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          set -x
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          cd PaddleFleet
          git config --global --add safe.directory /workspace/PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git submodule update --init --recursive
          git pull --no-edit origin pull/${PR_ID}/head
          pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt
          pip install paddlefleet --extra-index-url https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          pip install https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-TagBuild-Training-Linux-Gpu-Cuda12.9-Cudnn9.9-Trt10.5-Mkl-Avx-Gcc11-SelfBuiltPypiUse/e7db26b0ca3d3e90d097d1c4158beeb5d9ba19d4/paddlepaddle_gpu-3.4.0.dev20260113-cp310-cp310-linux_x86_64.whl --index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --force-reinstall --no-cache-dir
          echo "paddlefleet commit:"
          python -c "import paddlefleet; print(paddlefleet.version.commit)"
          echo "paddle commit:"
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Install PaddleFormers
        id: formers_install
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          set -x
          python -m pip install --upgrade pip
          git clone https://github.com/PaddlePaddle/PaddleFormers.git
          cd PaddleFormers
          cp examples/experiments/paddlefleet/glm45.json examples/experiments/paddlefleet/glm45_fp8.json
          git config --global --add safe.directory /workspace/PaddleFormers
          git log -1
          pip install -e .
          pip install librosa==0.11.0
          echo "paddlefleet commit:"
          python -c "import paddlefleet; print(paddlefleet.version.commit)"
          echo "paddle commit:"
          python -c "import paddle; print(paddle.version.commit)"
          cd /workspace
          wget -q --no-proxy -O bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
          mkdir bos
          tar xf bos_new.tar.gz -C bos
          pip install bce-python-sdk==0.8.74
          pip install coverage==7.6.1
          '

      - name: GLM4.5 pre-train
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-pt
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-pt/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          timeout 5m bash -x PaddleFormers/tests/integration_test/glm45_pt.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-pt
          coverage --version
          coverage combine
          coverage xml -o /workspace/PaddleFleet/coveragedata-multi-pt/coverage.xml
          coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: GLM4.5 sft
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-sft
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-sft/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          timeout 5m bash -x PaddleFormers/tests/integration_test/glm45_sft.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-sft
          coverage combine
          coverage xml -o /workspace/PaddleFleet/coveragedata-multi-sft/coverage.xml
          coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: GLM4.5 lora
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-lora
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-lora/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          timeout 5m bash -x PaddleFormers/tests/integration_test/glm45_lora.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-lora
          coverage --version
          coverage combine
          coverage xml -o /workspace/PaddleFleet/coveragedata-multi-lora/coverage.xml
          coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: GLM4.5 dpo
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-dpo
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-dpo/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          timeout 5m bash -x PaddleFormers/tests/integration_test/glm45_dpo.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-dpo
          coverage --version
          coverage combine
          coverage xml -o /workspace/PaddleFleet/coveragedata-multi-dpo/coverage.xml
          coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5 dpo.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5 dpo.\033[0m"
          fi
          '

      - name: Integration test (GLM4.5 multi-card FP8)
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-fp8
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-fp8/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          timeout 5m bash -x PaddleFormers/tests/integration_test/glm45_pt_fp8.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-fp8
          coverage --version
          coverage combine
          coverage xml -o /workspace/PaddleFleet/coveragedata-multi-fp8/coverage.xml
          coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5 FP8.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash PaddleFleet/ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
