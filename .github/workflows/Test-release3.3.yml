  coverage_check:
    name: Coverage Upload And Check
    needs: [multi-card_test, single_card_test, integration-test-a100, integration-test-H20-single-card, integration-test-H20-multi-card, check-bypass]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_REPO_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: coverage file download
        shell: bash
        run: |
          coverage_configs="
          multi_coverage.xml:multi-card/coverage.xml
          single_coverage.xml:single-card/coverage.xml
          h20_multi_pt_coverage.xml:h20-multi/coverage-multi-pt.xml
          h20_multi_sft_coverage.xml:h20-multi/coverage-multi-sft.xml
          h20_multi_lora_coverage.xml:h20-multi/coverage-multi-lora.xml
          h20_multi_dpo_coverage.xml:h20-multi/coverage-multi-dpo.xml
          h20_multi_fp8_coverage.xml:h20-multi/coverage-multi-fp8.xml
          h20_multi_grouped_gemm_coverage.xml:h20-multi/coverage-multi-grouped-gemm.xml
          h20_single_coverage.xml:h20-single/coverage-single.xml
          h20_qwen_coverage.xml:h20-qwen/coverage-qwen.xml
          a100_pt_coverage.xml:a100/coverage-a-pt.xml
          h20_qwen_multi_pt_coverage.xml:h20-multi/coverage-qwen-multi-pt.xml
          h20_qwen_multi_sft_coverage.xml:h20-multi/coverage-qwen-multi-sft.xml
          h20_qwen_multi_lora_coverage.xml:h20-multi/coverage-qwen-multi-lora.xml
          "
          base_url="https://paddle-github-action.bj.bcebos.com/${GITHUB_REPO_NAME}/pull/${PR_ID}/${COMMIT_ID}"

          echo "$coverage_configs" | while IFS= read -r config; do
            if [ -n "$config" ]; then
                filename="${config%%:*}"
                filepath="${config#*:}"
                wget "${base_url}/${filepath}" -O "$filename" --no-proxy
                sed -i "s|<source></source>|<source>paddlefleet</source>|" "$filename"
                sed -i "s|/usr/local/lib/python3.10/dist-packages/|src/|" "$filename"
                sed -i "s|.usr.local.lib.python3.10.dist-packages.paddlefleet|src|" "$filename"
            fi
          done
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD  --unified=0 > diff.txt
          echo "=== DIFF FILE ==="
          cat diff.txt
          echo "================="
          python -m pip install diff-cover
          COVERAGE_EXIT_CODE=0
          diff-cover multi_coverage.xml single_coverage.xml h20_multi_pt_coverage.xml h20_multi_sft_coverage.xml h20_multi_lora_coverage.xml h20_multi_dpo_coverage.xml h20_multi_fp8_coverage.xml h20_multi_grouped_gemm_coverage.xml \
          h20_single_coverage.xml h20_qwen_coverage.xml a100_pt_coverage.xml h20_qwen_multi_pt_coverage.xml h20_qwen_multi_sft_coverage.xml h20_qwen_multi_lora_coverage.xml --diff-file=diff.txt --fail-under=90 || COVERAGE_EXIT_CODE=9
          exit ${COVERAGE_EXIT_CODE}

      - name: filter coverage files and remove backup files
        if: always()
        run: |
          echo "=== CHECKING COVERAGE FILES ==="

          COVERAGE_FILES=(
            "multi_coverage.xml"
            "single_coverage.xml"
            "h20_multi_pt_coverage.xml"
            "h20_multi_sft_coverage.xml"
            "h20_multi_lora_coverage.xml"
            "h20_multi_dpo_coverage.xml"
            "h20_multi_fp8_coverage.xml"
            "h20_multi_grouped_gemm_coverage.xml"
            "h20_qwen_multi_pt_coverage.xml"
            "h20_qwen_multi_sft_coverage.xml"
            "h20_qwen_multi_lora_coverage.xml"
            "h20_single_coverage.xml"
            "h20_qwen_coverage.xml"
            "a100_pt_coverage.xml"
          )

          for COVERAGE_FILE in "${COVERAGE_FILES[@]}"; do
            python ci/filter_coverage.py "$COVERAGE_FILE" diff.txt
            BACKUP_FILE="${COVERAGE_FILE}.backup"
            if [ -f "$BACKUP_FILE" ]; then
              rm -f "$BACKUP_FILE"
              echo "Removed backup: $BACKUP_FILE"
            fi
          done

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./multi_coverage.xml,./single_coverage.xml,./h20_multi_pt_coverage.xml,./h20_multi_sft_coverage.xml,./h20_multi_lora_coverage.xml,./h20_multi_dpo_coverage.xml,./h20_qwen_multi_pt_coverage.xml,./h20_qwen_multi_sft_coverage.xml,./h20_qwen_multi_lora_coverage.xml,./h20_multi_fp8_coverage.xml,./h20_multi_grouped_gemm_coverage.xml,./h20_single_coverage.xml,./h20_qwen_coverage.xml,./a100_pt_coverage.xml
          flags: coverage_combine
          name: "${{ env.TASK }}-${{ github.run_id }}"
          fail_ci_if_error: true
          verbose: true
