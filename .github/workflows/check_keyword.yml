name: Check Forbidden Keyword
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-forbidden-keyword:
    name: Check Forbidden keyword
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for keyword keyword in PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          FORBIDDEN_KEYWORD: ${{ vars.FORBIDDEN_KEYWORD }}
        run: |
          FOUND=0

          # Check PR title
          if echo "${PR_TITLE}" | grep -qi "${FORBIDDEN_KEYWORD}"; then
            echo "ERROR: PR title contains forbidden keyword '${FORBIDDEN_KEYWORD}': ${PR_TITLE}"
            FOUND=1
          fi

          # Check PR body
          if echo "${PR_BODY}" | grep -qi "${FORBIDDEN_KEYWORD}"; then
            echo "ERROR: PR description contains forbidden keyword '${FORBIDDEN_KEYWORD}'"
            FOUND=1
          fi

          # Check changed files content
          git fetch origin ${BASE_REF}
          MERGE_BASE=$(git merge-base HEAD origin/${BASE_REF})
          CHANGED_FILES=$(git diff --name-only ${MERGE_BASE})

          while IFS= read -r file; do
            if [ -f "$file" ] && grep -qi "${FORBIDDEN_KEYWORD}" "$file"; then
              echo "ERROR: File '${file}' contains forbidden keyword '${FORBIDDEN_KEYWORD}'"
              FOUND=1
            fi
          done <<< "${CHANGED_FILES}"

          if [ "${FOUND}" == "1" ]; then
            echo "--------"
            echo "PR contains forbidden keyword (case-insensitive)."
            echo "Please remove all occurrences before merging."
            exit 1
          fi

          echo "No forbidden keywords found."
