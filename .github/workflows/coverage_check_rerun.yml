name: Coverage-check Re-run

on:
  workflow_run:
    workflows: ["Coverage Approval"]
    types: [completed]

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: coverage-rerun-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}-${{ github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  rerun-on-approval:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review'
    runs-on:
      group: APPROVAL
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha || github.event.workflow_run.head_sha }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      CONTROLLER_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      API_VERSION: 2022-11-28
    steps:
      - name: Cancel coverage check and rerun approval
        id: schedule
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local response status body method path payload
            method="$1"
            path="$2"
            payload="${3:-}"
            if [[ -n "${payload}" ]]; then
              response=$(curl --silent --show-error \
                --request "${method}" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: ${API_VERSION}" \
                --header "Content-Type: application/json" \
                --data "${payload}" \
                --write-out $'\n%{http_code}' \
                "https://api.github.com${path}")
            else
              response=$(curl --silent --show-error \
                --request "${method}" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: ${API_VERSION}" \
                --write-out $'\n%{http_code}' \
                "https://api.github.com${path}")
            fi
            status=$(printf '%s\n' "${response}" | tail -n 1)
            body=$(printf '%s\n' "${response}" | sed '$d')
            if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
              printf 'GitHub API %s %s failed with HTTP %s\n%s\n' "$1" "$2" "${status}" "${body}" >&2
              return 1
            fi
            printf '%s' "${body}"
          }

          if [[ -z "${HEAD_SHA}" ]]; then
            echo "The triggering workflow run has no head SHA; nothing to rerun."
            exit 0
          fi

          trigger_jobs=$(api GET "/repos/${REPO}/actions/runs/${TRIGGER_RUN_ID}/jobs?filter=latest&per_page=100")
          signal_conclusion=$(jq -r '
            [.jobs[] | select(.name == "signal")]
            | last
            | .conclusion // empty
          ' <<<"${trigger_jobs}")
          if [[ "${signal_conclusion}" != "success" ]]; then
            echo "Coverage Approval signal did not succeed; nothing to rerun."
            exit 0
          fi

          if [[ -z "${PR_NUMBER}" ]]; then
            echo "No PR association in workflow_run; resolving PR from commit ${HEAD_SHA}."
            candidates='[]'
            page=1
            while :; do
              pulls=$(api GET "/repos/${REPO}/commits/${HEAD_SHA}/pulls?per_page=100&page=${page}")
              matches=$(jq -c --arg sha "${HEAD_SHA}" --arg repo "${REPO}" '
                [.[]
                  | select(.state == "open")
                  | select(.head.sha == $sha)
                  | select(.base.repo.full_name == $repo)
                  | .number
                ]
              ' <<<"${pulls}")
              candidates=$(jq -cn --argjson previous "${candidates}" --argjson current "${matches}" '$previous + $current | unique')
              if [[ $(jq 'length' <<<"${pulls}") -lt 100 ]]; then
                break
              fi
              page=$((page + 1))
            done
            candidate_count=$(jq 'length' <<<"${candidates}")
            if [[ "${candidate_count}" != "1" ]]; then
              echo "Found ${candidate_count} matching open PRs for head ${HEAD_SHA}; nothing to rerun."
              exit 0
            fi
            PR_NUMBER=$(jq -r '.[0]' <<<"${candidates}")
          fi
          echo "Resolved PR ${PR_NUMBER} at head ${HEAD_SHA}."

          pr=$(api GET "/repos/${REPO}/pulls/${PR_NUMBER}")
          if ! jq -e --arg repo "${REPO}" '.state == "open" and .base.repo.full_name == $repo' <<<"${pr}" >/dev/null; then
            echo "The PR is not open in ${REPO}; nothing to rerun."
            exit 0
          fi
          current_sha=$(jq -r '.head.sha' <<<"${pr}")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<<"${pr}")
          head_ref=$(jq -r '.head.ref // empty' <<<"${pr}")
          if [[ -z "${head_repo}" || -z "${head_ref}" ]]; then
            echo "The PR source repository or branch is unavailable; nothing to rerun."
            exit 0
          fi
          if [[ "${current_sha}" != "${HEAD_SHA}" ]]; then
            echo "PR head changed from ${HEAD_SHA} to ${current_sha}; nothing to rerun."
            exit 0
          fi

          check_payload=$(jq -n \
            --arg name "Coverage rerun controller" \
            --arg head_sha "${HEAD_SHA}" \
            --arg details_url "${CONTROLLER_URL}" \
            '{name: $name, head_sha: $head_sha, status: "in_progress", details_url: $details_url}')
          check_run=$(api POST "/repos/${REPO}/check-runs" "${check_payload}")
          check_run_id=$(jq -r '.id // empty' <<<"${check_run}")
          if [[ ! "${check_run_id}" =~ ^[0-9]+$ ]]; then
            echo "GitHub did not return a valid check-run ID."
            exit 1
          fi
          echo "check_run_id=${check_run_id}" >> "${GITHUB_OUTPUT}"

          finish() {
            local result="$1"
            local summary="$2"
            echo "result=${result}" >> "${GITHUB_OUTPUT}"
            echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          workflow=$(api GET "/repos/${REPO}/actions/workflows/Test-release.yml")
          workflow_id=$(jq -r '.id // empty' <<<"${workflow}")
          if [[ -z "${workflow_id}" ]]; then
            finish skipped "Test-release workflow was not found."
          fi

          runs=$(api GET "/repos/${REPO}/actions/workflows/${workflow_id}/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100")
          run_id=$(jq -r --arg sha "${HEAD_SHA}" --arg head_repo "${head_repo}" --arg head_ref "${head_ref}" '
            [.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.head_repository.full_name == $head_repo)
              | select(.head_branch == $head_ref)
              | select(.event == "pull_request")
            ]
            | sort_by(.run_number)
            | last
            | .id // empty
          ' <<<"${runs}")

          if [[ -z "${run_id}" ]]; then
            finish skipped "No matching Test-release run found for PR ${PR_NUMBER} at ${HEAD_SHA}."
          fi
          echo "Selected Test-release run: ${run_id}"

          jobs=$(api GET "/repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100")
          approval_job=$(jq -c '
            [.jobs[] | select(.name == "Check coverage approval")]
            | sort_by(.started_at // .completed_at // "")
            | last // empty
          ' <<<"${jobs}")
          coverage_job=$(jq -c '
            [.jobs[] | select(.name == "Coverage Upload And Check")]
            | sort_by(.started_at // .completed_at // "")
            | last // empty
          ' <<<"${jobs}")

          if [[ -z "${approval_job}" ]]; then
            finish skipped "Coverage approval job is not available yet."
          fi

          required_jobs=(
            "Check bypass"
            "Unit test (single card)"
            "Unit test (multi-card)"
            "Integration test (H20, single card)"
            "Integration test (H20, multi-card)"
            "Integration test (A100)"
            "Check coverage approval"
          )
          unfinished_jobs=()
          for job_name in "${required_jobs[@]}"; do
            job_status=$(jq -r --arg name "${job_name}" '
              [.jobs[]
                | select(
                    .name == $name or
                    ($name == "Check bypass" and (.name | endswith(" / Check bypass")))
                  )
              ]
              | sort_by(.started_at // .completed_at // "")
              | last
              | .status // "missing"
            ' <<<"${jobs}")
            if [[ "${job_status}" != "completed" ]]; then
              unfinished_jobs+=("${job_name} (${job_status})")
            fi
          done

          if (( ${#unfinished_jobs[@]} > 0 )); then
            printf 'Previous jobs are not completed yet: %s\n' "${unfinished_jobs[*]}"
            finish skipped "Previous Test-release jobs are not completed yet."
          fi

          approval_conclusion=$(jq -r '.conclusion // empty' <<<"${approval_job}")
          coverage_status="not_started"
          if [[ -n "${coverage_job}" ]]; then
            coverage_status=$(jq -r '.status' <<<"${coverage_job}")
          fi
          approval_job_id=$(jq -r '.id' <<<"${approval_job}")

          if [[ -z "${approval_conclusion}" ]]; then
            finish skipped "Coverage approval job has no conclusion."
          fi

          if [[ "${coverage_status}" == "queued" || "${coverage_status}" == "not_started" ]]; then
            echo "Coverage check has not started (${coverage_status}); rerunning coverage approval without cancelling Test-release."
            api POST "/repos/${REPO}/actions/jobs/${approval_job_id}/rerun" >/dev/null
            finish success "Submitted coverage approval job rerun; coverage check will be reevaluated."
          fi

          if [[ "${coverage_status}" == "in_progress" ]]; then
            echo "Cancelling Test-release run ${run_id} because coverage check is already in progress."
            api POST "/repos/${REPO}/actions/runs/${run_id}/cancel" >/dev/null

            for attempt in {1..60}; do
              run=$(api GET "/repos/${REPO}/actions/runs/${run_id}")
              status=$(jq -r '.status' <<<"${run}")
              if [[ "${status}" != "queued" && "${status}" != "in_progress" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "${status}" == "queued" || "${status}" == "in_progress" ]]; then
              echo "Test-release run ${run_id} did not finish cancelling in time."
              exit 1
            fi

            echo "Rerunning coverage approval job ${approval_job_id} after cancelling Test-release."
            api POST "/repos/${REPO}/actions/jobs/${approval_job_id}/rerun" >/dev/null
            finish success "Cancelled Test-release and submitted coverage approval job rerun; coverage check will be reevaluated."
          fi

          finish skipped "Coverage check is already terminal (${coverage_status}); no rerun requested."

      - name: Complete coverage rerun check
        if: ${{ always() && steps.schedule.outputs.check_run_id != '' }}
        shell: bash
        env:
          CHECK_RUN_ID: ${{ steps.schedule.outputs.check_run_id }}
          SCHEDULE_OUTCOME: ${{ steps.schedule.outcome }}
          SCHEDULE_RESULT: ${{ steps.schedule.outputs.result }}
          SCHEDULE_SUMMARY: ${{ steps.schedule.outputs.summary }}
          WAS_CANCELLED: ${{ cancelled() }}
        run: |
          set -euo pipefail

          if [[ "${WAS_CANCELLED}" == "true" || "${SCHEDULE_OUTCOME}" == "cancelled" ]]; then
            conclusion="cancelled"
            summary="Coverage rerun controller was cancelled."
          elif [[ "${SCHEDULE_OUTCOME}" == "failure" ]]; then
            conclusion="failure"
            summary="Coverage rerun controller failed. See the Actions logs for details."
          elif [[ "${SCHEDULE_OUTCOME}" == "success" && ( "${SCHEDULE_RESULT}" == "success" || "${SCHEDULE_RESULT}" == "skipped" ) ]]; then
            conclusion="${SCHEDULE_RESULT}"
            summary="${SCHEDULE_SUMMARY}"
          else
            conclusion="failure"
            summary="Coverage rerun controller did not report a valid result."
          fi

          payload=$(jq -n \
            --arg conclusion "${conclusion}" \
            --arg summary "${summary}" \
            '{status: "completed", conclusion: $conclusion, output: {title: ("Coverage rerun controller: " + $conclusion), summary: $summary}}')
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: ${API_VERSION}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "https://api.github.com/repos/${REPO}/check-runs/${CHECK_RUN_ID}" >/dev/null
