name: Coverage Approval

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  check-approval:
    name: Check coverage approval
    if: ${{ github.event.review.user.login == 'swgu98' && github.event.review.state == 'approved' }}
    runs-on:
      group: APPROVAL
    steps:
      - name: Validate coverage approval
        env:
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          review_body=$(printf '%s' "${REVIEW_BODY}" | tr '[:upper:]' '[:lower:]')
          if [[ "${review_body}" != *lgtm* || "${review_body}" != *coverage* ]]; then
            echo "The review body must contain both LGTM and coverage."
            exit 1
          fi
          echo "swgu98 submitted a valid coverage approval."
