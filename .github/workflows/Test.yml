          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: GLM4.5 sft+lora
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-sft
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-sft/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          bash -x PaddleFleet/ci/integration_test/glm45_sft.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-sft
          source /workspace/PaddleFleet/.venv/bin/activate
          uv run coverage --version
          uv run coverage combine
          uv run coverage xml -o /workspace/PaddleFleet/coveragedata-multi-sft/coverage.xml
          uv run coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      - name: Integration test (GLM4.5 multi-card FP8)
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-fp8
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-fp8/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          bash -x PaddleFleet/ci/integration_test/glm45_pt_fp8.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-fp8
          source /workspace/PaddleFleet/.venv/bin/activate
          uv run coverage --version
          uv run coverage combine
          uv run coverage xml -o /workspace/PaddleFleet/coveragedata-multi-fp8/coverage.xml
          uv run coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5 FP8.\033[0m"
          fi
          '

      - name: H20 Coverage Upload to BOS
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xce '
          wget -q --no-proxy --no-check-certificate \
            https://paddle-qa.bj.bcebos.com/CodeSync/develop/PaddlePaddle/PaddleTest/tools/bos_tools.py \
            -O bos_tools.py
          push_file=$(realpath bos_tools.py)
          cp /workspace/PaddleFleet/coveragedata-multi-pt/coverage.xml coverage-multi-pt.xml
          cp /workspace/PaddleFleet/coveragedata-multi-sft/coverage.xml coverage-multi-sft.xml
          cp /workspace/PaddleFleet/coveragedata-multi-fp8/coverage.xml coverage-multi-fp8.xml
          target_path_multi="paddle-github-action/${GITHUB_REPO_NAME}/pull/${PR_ID}/${GITHUB_SHA}/h20-multi"
          target_path_multi_fp8="paddle-github-action/${GITHUB_REPO_NAME}/pull/${PR_ID}/${GITHUB_SHA}/h20-multi-fp8"
          uv run ${push_file} coverage-multi-pt.xml ${target_path_multi}
          uv run ${push_file} coverage-multi-sft.xml ${target_path_multi}
          uv run ${push_file} coverage-multi-fp8.xml ${target_path_multi_fp8}
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}


