          pip install -e .
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: GLM4.5 pre-train
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          source /root/proxy
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-pt/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          bash -x PaddleFleet/ci/integration_test/glm45_pt_a100.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-pt
          source /workspace/PaddleFleet/.venv/bin/activate
          uv run coverage combine
          uv run coverage xml -o /workspace/PaddleFleet/coveragedata-pt/coverage.xml
          uv run coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5.\033[0m"
          fi
          '

      # - name: GLM4.5 sft+lora
      #   run: |
      #     docker exec -t ${{ env.container_name }} /bin/bash -ce '
      #     source /root/proxy
      #     source /root/proxy
