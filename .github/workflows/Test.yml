    needs: check-bypass
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    name: Integration test (H20, multi-card)
    runs-on:
      group: Fleet-H-multi-card
    env:
      PIP_CACHE_DIR: /root/.cache/pip
      CACHE_DIR: /root/.cache
      TASK: paddlefleet-CI-${{ github.event.pull_request.number }}-integration-test-multi-card
    steps:
