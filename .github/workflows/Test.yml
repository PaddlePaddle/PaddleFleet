    name: Check bypass
    if: ${{ inputs.can-skip != 'true' }}
    uses: ./.github/workflows/check-bypass.yml
    with:
      workflow-name: 'test'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

