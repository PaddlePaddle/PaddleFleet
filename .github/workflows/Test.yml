name: Test

on:
  pull_request:
    branches:
      - develop

permissions: read-all

concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  work_dir: /paddle
  PADDLE_ROOT: /paddle
  TASK: paddlefleet-CI-${{ github.event.pull_request.number }}-test
  ci_scripts: /paddle/ci
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  CI_name: test
  no_proxy: "bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
  docker_image: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda129-coverage-test"

defaults:
  run:
    shell: bash

jobs:
  check-bypass:
    name: Check bypass
    if: ${{ inputs.can-skip != 'true' }}
    uses: ./.github/workflows/check-bypass.yml
    with:
      workflow-name: 'test'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    needs: check-bypass
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    runs-on:
      group: CI-H
    env:
      PIP_CACHE_DIR: /root/.cache/pip

    steps:
      - name: Check docker image and run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --gpus all --name ${container_name} \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../../proxy:/root/proxy \
            -v ${{ github.workspace }}/../../../.cache:/root/.cache \
            -v ${{ github.workspace }}:/paddle \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e work_dir \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -w /paddle --network host ${docker_image}

      - name: Clone PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          rm -rf * .[^.]*
          set -e
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git .
          git config --global --add safe.directory /paddle
          git config pull.rebase false
          git pull --no-edit origin pull/${PR_ID}/head
          mkdir -p /root/.cache/pip
          pip cache dir
          echo "Install uv"
          pip install -q uv
          echo "uv sync"
          uv sync > /dev/null 2>&1
          '

      - name: Single card test
        if: steps.check-bypass.outputs.can-skip != 'true'
        continue-on-error: true
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          bash ci/single_card_test.sh
          single_card_exit_code=$?
          echo "single_card_exit_code=$single_card_exit_code" >> ${{ github.env }}
          '

      - name: Multi-card test
        if: steps.check-bypass.outputs.can-skip != 'true'
        continue-on-error: true
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          bash ci/multi-card_test.sh
          multi_card_exit_code=$?
          echo "multi_card_exit_code=$multi_card_exit_code" >> ${{ github.env }}
          '

      - name: Test summary
        if: steps.check-bypass.outputs.can-skip != 'true'
        env:
          single_card_exit_code: ${{ env.single_card_exit_code }}
          multi_card_exit_code: ${{ env.multi_card_exit_code }}
        run: |
          exit_code=0
          if [[ "$single_card_exit_code" != "0" ]]; then
            echo -e "Single card test failed, please check the '\033[34mSingle card test\033[0m' step."
            exit_code=1
          else
            echo "Single card test succeeded."
          fi
          if [[ "$multi_card_exit_code" != "0" ]]; then
            echo -e "Multi card test failed, please check the '\033[34mMulti card test\033[0m' step."
            exit_code=1
          else
            echo "Multi card test succeeded."
          fi
          exit $exit_code

      - name: Terminate and delete the container
        if: ${{ steps.check-bypass.outputs.can-skip != 'true' && always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
