name: Test

on:
  pull_request:
    branches:
      - develop

permissions: read-all

concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  work_dir: /paddle
  PADDLE_ROOT: /paddle
  ci_scripts: /paddle/ci
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  CI_name: test
  no_proxy: "bcebos.com,.bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
  docker_image: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda129-coverage-test"

defaults:
  run:
    shell: bash

jobs:
  check-bypass:
    name: Check bypass
    if: ${{ inputs.can-skip != 'true' }}
    uses: ./.github/workflows/check-bypass.yml
    with:
      workflow-name: 'test'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build_whl:
    name: Build Fleet whl
    needs: check-bypass
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    runs-on:
      group: GZ_BD-CPU
    env:
      TASK: fleet-ci-build-whl-${{ github.event.pull_request.number }}
    steps:
      - name: Check docker image and run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} \
            -v "/dev/shm:/dev/shm"  \
            -v "/home/data/cfs:/home/data/cfs" \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}:/paddle \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e no_proxy \
            -e CI_name \
            -w /paddle --network host ${docker_image}

      - name: uv build whl
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source ${{ github.workspace }}/../../../proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git .
          set -x
          git config --global --add safe.directory /paddle
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git pull --no-edit origin pull/${PR_ID}/head
          mkdir -p /home/.cache/pip
          pip cache dir
          echo "Install uv"
          pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt
          echo "uv build"
          export UV_HTTP_TIMEOUT=300
          git submodule update --init --recursive
          export LD_LIBRARY_PATH=/usr/local/cuda-12.9/compat:$LD_LIBRARY_PATH
          uv build --wheel --package paddlefleet --out-dir dist --clear
          uv build --wheel --package paddlefleet-ops --out-dir dist
          ls -lh dist
          '

      - name: upload whl to BOS
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          export AK=paddle
          export SK=paddle
          cd /paddle/dist
          if [ ! -f "bos/BosClient.py" ]; then
            wget -q --no-proxy -O bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
            mkdir bos
            tar xf bos_new.tar.gz -C bos
          fi
          target_path="paddle-github-action/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}"
          ROOT_WHL=$(ls paddlefleet-*.whl | head -n1)
          OPS_WHL=$(ls paddlefleet_ops-*.whl | head -n1)
          ROOT_DST=paddlefleet-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          OPS_DST=paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          [ "${ROOT_WHL}" != "${ROOT_DST}" ] && cp "${ROOT_WHL}" "${ROOT_DST}"
          [ "${OPS_WHL}" != "${OPS_DST}" ] && cp "${OPS_WHL}" "${OPS_DST}"
          python bos/BosClient.py "${ROOT_DST}" ${target_path}
          python bos/BosClient.py "${OPS_DST}" ${target_path}
          '
      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}

  single_card_test:
    name: Unit test (single card)
    needs: [check-bypass, build_whl]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    runs-on:
      group: Fleet-H-single-card
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      TASK: paddlefleet-CI-${{ github.event.pull_request.number }}-single-card-test

    steps:
      - name: Determine the runner
        run: |
          gpu_id=$(( $(echo $PWD | awk -F'/' '{print $3}' | awk -F'-' '{print $2}') + 3 ))
          echo GPU_DEVICES="$gpu_id" >> $GITHUB_ENV

      - name: Check docker image and run container
        env:
          GPU_DEVICES: ${{ env.GPU_DEVICES }}
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} --gpus "\"device=${GPU_DEVICES}\"" --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/paddle \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -e work_dir \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -w /paddle --network host ${docker_image}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          set -x
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git .
          git config --global --add safe.directory /paddle
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git pull --no-edit origin pull/${PR_ID}/head
          pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt
          wget https://paddle-github-action.cdn.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          wget https://paddle-github-action.cdn.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/paddlefleet-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          pip install paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          pip install paddlefleet-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          '

      - name: Single card test
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xce '
          pwd
          export WITH_COVERAGE=ON
          pip install https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-GpuAll-LinuxCentos-Gcc11-Cuda129-Cudnn99-Trt105-Py310-Compile/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl --index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --force-reinstall --no-cache-dir
          python -c "import paddle; print(paddle.version.commit)"
          bash ci/single_card_test.sh
          single_card_exit_code=$?
          if [[ "$single_card_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mSingle card test failed.\033[0m"
            exit 1
          else
            echo -e "\033[32mSingle card test succeeded.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}

  multi-card_test:
    name: Unit test (multi-card)
    needs: [check-bypass, build_whl]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    runs-on:
      group: Fleet-H-multi-card
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      TASK: paddlefleet-CI-${{ github.event.pull_request.number }}-multi-card_test
    steps:
      - name: Check docker image and run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --gpus all --name ${container_name} \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/paddle \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -e work_dir \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -w /paddle --network host ${docker_image}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source /root/proxy
          set -x
          git clone https://github.com/PaddlePaddle/PaddleFleet.git .
          git config --global --add safe.directory /paddle
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git pull --no-edit origin pull/${PR_ID}/head
          git submodule update --init --recursive
          pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt
          wget https://paddle-github-action.cdn.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/paddlefleet-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          wget https://paddle-github-action.cdn.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          export UV_SKIP_WHEEL_FILENAME_CHECK=1 #This environment variable allows installing the latest commit-level whl package of Paddle.
          pip install paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          pip install paddlefleet-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          pip install https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-GpuAll-LinuxCentos-Gcc11-Cuda129-Cudnn99-Trt105-Py310-Compile/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl --index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --force-reinstall --no-cache-dir
          python -c "import paddle; print(paddle.version.commit)"
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          '

      - name: Multi-card test
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          bash ci/multi-card_test.sh
          multi_card_exit_code=$?
          if [[ "$multi_card_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mMulti card test failed.\033[0m"
            exit 1
          else
            echo -e "\033[32mMulti card test succeeded.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}


  integration-test-H20-single-card:
    needs: [check-bypass, build_whl]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    name: Integration test (H20, single card)
    runs-on:
      group: Fleet-H-single-card
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      TASK: paddlefleet-CI-${{ github.event.pull_request.number }}-integration-test-single-card
    steps:
      - name: Determine the runner
        run: |
          gpu_id=$(( $(echo $PWD | awk -F'/' '{print $3}' | awk -F'-' '{print $2}') + 3 ))
          echo GPU_DEVICES="$gpu_id" >> $GITHUB_ENV

      - name: Check docker image and run container
        env:
          GPU_DEVICES: ${{ env.GPU_DEVICES }}
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          set -x
          docker run -d -t --name ${container_name} --gpus "\"device=${GPU_DEVICES}\"" --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e PR_USER="${{ github.event.pull_request.user.login }}" \
            -w /workspace --network host ${docker_image}


      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          nvidia-smi
          rm -rf * .[^.]*
          source /root/proxy
          set -x
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          git config --global --add safe.directory /workspace/PaddleFleet
          cd PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git pull --no-edit origin pull/${PR_ID}/head
          pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt
          wget https://paddle-github-action.cdn.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          wget https://paddle-github-action.cdn.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/paddlefleet-0.0.1.dev-cp310-cp310-linux_x86_64.whl
          pip install paddlefleet_ops-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          pip install paddlefleet-0.0.1.dev-cp310-cp310-linux_x86_64.whl --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/
          pip install https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-GpuAll-LinuxCentos-Gcc11-Cuda129-Cudnn99-Trt105-Py310-Compile/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl --index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --force-reinstall --no-cache-dir
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Install PaddleFormers
        id: formers_install
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          set -x
          python -m pip install --upgrade pip
          git clone https://github.com/PaddlePaddle/PaddleFormers.git
          cd PaddleFormers
          git config --global --add safe.directory /workspace/PaddleFormers
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git log -1
          sed -i "s/from gpt_provider import GPTModelProvider/from paddleformers.transformers.gpt_provider import GPTModelProvider/g" examples/experiments/paddlefleet/glm45_provider.py
          sed -i "s/from gpt_provider import GPTModelProvider/from paddleformers.transformers.gpt_provider import GPTModelProvider/g" examples/experiments/paddlefleet/qwen_provider.py
          pip install -e .
          pip install librosa==0.11.0
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Proprocess for integration test
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          bash -x PaddleFormers/tests/integration_test/preprocess.sh
          preprocess_exit_code=$?
          if [[ "$preprocess_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mPreprocess failed.\033[0m"
            exit 1
          else
            echo -e "\033[32mPreprocess succeeded.\033[0m"
          fi
          '

      - name: Integration test (GLM4.5 single-card)
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          bash -x PaddleFormers/tests/integration_test/glm45_pt_single_card.sh
          glm45_single_card_exit_code=$?
          if [[ "$glm45_single_card_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5 single-card.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: GLM4.5 single-card.\033[0m"
          fi
          '

      - name: Integration test (Qwen3-30B-A3B single-card)
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          bash -x PaddleFormers/tests/integration_test/qwen3_single_card.sh
          qwen3_single_card_exit_code=$?
          if [[ "$qwen3_single_card_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: Qwen3-30B-A3B single-card.\033[0m"
            exit 1
          else
            echo -e "\033[32mIntegration test succeeded: Qwen3-30B-A3B single-card.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash PaddleFleet/ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}

  integration-test-H20-multi-card:
    needs: [check-bypass, build_whl]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' }}
    name: Integration test (H20, multi-card)
    runs-on:
      group: Fleet-H-multi-card
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      TASK: paddlefleet-CI-${{ github.event.pull_request.number }}-integration-test-multi-card
    steps:
      - name: Check docker image and run container
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull $docker_image
          docker run -d -t --name ${container_name} --gpus all --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e CI_name \
            -e PIP_CACHE_DIR \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_EVENT_PULL_REQUEST_NUMBER="${{ github.event.pull_request.number }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e PR_USER="${{ github.event.pull_request.user.login }}" \
            -w /workspace --network host ${docker_image}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          set -x
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          cd PaddleFleet
          git config --global --add safe.directory /workspace/PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git pull --no-edit origin pull/${PR_ID}/head
          pip install uv coverage==7.6.1 bce-python-sdk==0.8.74 wrapt
