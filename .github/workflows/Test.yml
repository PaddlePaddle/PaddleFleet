          uv pip install https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-GpuAll-LinuxCentos-Gcc11-Cuda129-Cudnn99-Trt105-Py310-Compile/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl --index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --force-reinstall
          source .venv/bin/activate
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: Install PaddleFormers
        id: formers_install
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFormers.git
          cd PaddleFormers
          cp examples/experiments/paddlefleet/glm45.json examples/experiments/paddlefleet/glm45_fp8.json
          git config --global --add safe.directory /workspace/PaddleFormers
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git log -1
          source ../PaddleFleet/.venv/bin/activate
          pip install -e .
          python -c "import paddle; print(paddle.version.commit)"
          '

      - name: GLM4.5 pre-train
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          mkdir -p /workspace/PaddleFleet/coveragedata-multi-pt
          export COVERAGE_FILE=/workspace/PaddleFleet/coveragedata-multi-pt/.coverage
          export COVERAGE_RCFILE=/workspace/PaddleFleet/ci/.coveragerc
          bash -x PaddleFleet/ci/integration_test/glm45_pt.sh
          glm45_exit_code=$?
          ls -a /workspace/PaddleFleet/coveragedata-multi-pt
          source /workspace/PaddleFleet/.venv/bin/activate
          uv run coverage --version
          uv run coverage combine
          uv run coverage xml -o /workspace/PaddleFleet/coveragedata-multi-pt/coverage.xml
          uv run coverage report -m
          if [[ "$glm45_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mIntegration test failed: GLM4.5.\033[0m"
