name: Approval

on:
  pull_request:
    types: [opened, synchronize]

env:
  BRANCH: ${{ github.base_ref }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_ID: ${{ github.event.pull_request.number }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha }}
  token: ${{ vars.ACTION_GITHUB_TOKEN }}

jobs:
  check-approvers:
    name: Check approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 200

      - name: Update PaddleFleet repo
        run: |
          python --version
          git switch -c test
          git remote add upstream https://github.com/PaddlePaddle/PaddleFleet.git
          git fetch upstream $BRANCH
          git checkout $BRANCH
          git config --global user.name "PaddleCI"
          git config --global user.email "paddle_ci@example.com"
          git merge test

      - name: Check bypass
        id: check-bypass
        uses: ./.github/actions/check-bypass
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow-name: approval

      - name: Setup python3.10
        if: steps.check-bypass.outputs.can-skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Display Required Approvers
        if: steps.check-bypass.outputs.can-skip != 'true'
        run: |
          bash ci/check_approval.sh
