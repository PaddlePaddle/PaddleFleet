name: Bot Approval Refresh

# 当 PR review 被 approve 时，自动重跑 bot approval 门禁，确保当前 head 重新被校验。
on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  rerun-bot-approval:
    name: Rerun bot approval gate
    if: ${{ github.event.review.state == 'approved' }}
    runs-on:
      group: APPROVAL
    steps:
      - name: Cleanup
        run: |
          rm -rf * .[^.]*

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Re-run bot approval jobs
        uses: ./.github/actions/rerun-workflow
        with:
          PR_ID: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          JOB_NAME: 'Require review-bot approval'
