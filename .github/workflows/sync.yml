name: uv sync

on: pull_request

permissions:
  contents: read

jobs:
  build-whl:
    runs-on: ubuntu-latest

    # ❌ 移除 jobs.container，改用手动模式以获得磁盘控制权
    # container: ...

    steps:
      # 【第一步】暴力清理磁盘（关键！）
      # 这能在 Docker 启动前腾出约 15GB+ 空间
      - name: Free Disk Space (Ubuntu)
        uses: BRAINSia/free-disk-space@f9f59b0ef974ff4b873aa243ce5278ab644eedc6
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          mandb: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ccr-766pxhy4-pub.cnc.hkg.baidubce.com/paddlepaddle/paddle:cuda129-coverage-test \
            /bin/bash -c "
              apt-get update && \
              apt-get install -y curl git patchelf && \
              git config --global --add safe.directory /work && \
              curl -LsSf https://astral.sh/uv/install.sh | sh && \
              export LD_LIBRARY_PATH=/usr/local/cuda-12.9/compat:$LD_LIBRARY_PATH && \
              /root/.local/bin/uv sync --no-cache --link-mode hardlink -v
            "
