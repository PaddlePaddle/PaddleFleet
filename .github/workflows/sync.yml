name: uv sync

on: pull_request

permissions:
  contents: read

jobs:
  build-whl:
    runs-on: ubuntu-latest

    container:
      image: nvidia/cuda:12.9.0-cudnn-devel-ubuntu22.04
      options: --network host --shm-size 32g
      env:
        LD_LIBRARY_PATH: /usr/local/cuda-12.9/compat:$LD_LIBRARY_PATH

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Build Wheel
        run: |
          export UV_HTTP_TIMEOUT=300
          uv sync
