name: CE Daily Release

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: # 可选：允许手动点 Run
    inputs:
      use_release:
        description: '是否使用预编译的release paddle版本'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
        required: false

permissions: read-all

concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PR_ID: ${{ github.event.pull_request.number || '0' }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  work_dir: /paddle/PaddleFleet
  PADDLE_ROOT: /paddle
  ci_scripts: /paddle/ci
  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
  no_proxy: "bcebos.com,.bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
  docker_image_cu126: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda126-dev"
  docker_image_cu129: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda129-py312-dev"
  docker_image_cu130: "ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda130-py312-dev"
  paddle_url_cu126: "https://paddle-qa.bj.bcebos.com/paddle-pipeline/Release-TagBuild-Training-Linux-Gpu-Cuda12.6-Cudnn9.5-Trt10.5-Mkl-Avx-Gcc11-SelfBuiltPypiUse/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl"
  paddle_url_cu129: "https://paddle-qa.bj.bcebos.com/paddle-pipeline/Release-TagBuild-Training-Linux-Gpu-Cuda12.9-Cudnn9.9-Trt10.5-Mkl-Avx-Gcc11-SelfBuiltPypiUse/latest/"
  paddle_url_cu130: "https://paddle-qa.bj.bcebos.com/paddle-pipeline/Release-TagBuild-Training-Linux-Gpu-Cuda130-Cudnn913-Trt1013-Mkl-Avx-Gcc11-SelfBuiltPypiUse/latest/paddlepaddle_gpu-0.0.0-cp310-cp310-linux_x86_64.whl"
  paddlefleet_url: "https://paddle-github-action.cdn.bcebos.com/PaddleFleet/develop/latest/"
  use_release: ${{ inputs.use_release || 'true' }}
  fleet_branch: "develop"
  formers_branch: "develop"
defaults:
  run:
    shell: bash

jobs:
  single_card_test:
    name: Unit test (single card)
    runs-on:
      group: Fleet-H-single-card
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - cuda: "12.6"
            python: "3.10"
          - cuda: "12.9"
            python: "3.10"
          - cuda: "13.0"
            python: "3.10"
          - cuda: "12.9"
            python: "3.11"
          - cuda: "12.9"
            python: "3.12"
          - cuda: "12.9"
            python: "3.13"
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      TASK: paddlefleet-CE-${{ matrix.cuda }}-${{ matrix.python }}-Release-single-card-test
    steps:
      - name: Determine the runner
        run: |
          gpu_id=$(( $(echo $PWD | awk -F'/' '{print $3}' | awk -F'-' '{print $2}') - 1 ))
          cuda=${{ matrix.cuda }}
          python_version=${{ matrix.python }}
          echo GPU_DEVICES="$gpu_id" >> $GITHUB_ENV
          if [ "${cuda}" == "12.9" ]; then
            docker_image=${docker_image_cu129}
            cuda_version="cu129"
            paddle_url=${paddle_url_cu129}
          elif [ "${cuda}" == "13.0" ]; then
            docker_image=${docker_image_cu130}
            cuda_version="cu130"
            paddle_url=${paddle_url_cu130}
          else
            docker_image=${docker_image_cu126}
            cuda_version="cu126"
            paddle_url=${paddle_url_cu126}
          fi
          echo "DOCKER_IMAGE=${docker_image}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${cuda_version}" >> $GITHUB_ENV
          echo "PYTHON_VERSION=${python_version}" >> $GITHUB_ENV
          echo "PADDLE_URL=${paddle_url}" >> $GITHUB_ENV
      - name: Check docker image and run container
        env:
          GPU_DEVICES: ${{ env.GPU_DEVICES }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          CUDA_VERSION: ${{ env.CUDA_VERSION }}
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          PADDLE_URL: ${{ env.PADDLE_URL }}

        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull ${DOCKER_IMAGE}
          docker run -d -t --name ${container_name} --gpus "\"device=${GPU_DEVICES}\"" --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/paddle \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e use_release \
            -e repo_flag="paddlefleet" \
            -e PIP_CACHE_DIR \
            -e work_dir \
            -e CUDA_VERSION \
            -e PYTHON_VERSION \
            -e PADDLE_URL \
            -e paddlefleet_url \
            -e fleet_branch \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -w /paddle --network host ${DOCKER_IMAGE}


      - name: Single card test
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xce '
          pwd
          rm -rf * .[^.]*
          source /root/proxy
          mkdir -p /home/.cache/pip
          pip cache dir
          wget https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda -u
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          conda init bash
          conda create -n python${PYTHON_VERSION} python=${PYTHON_VERSION} -y
          conda activate python${PYTHON_VERSION}
          paddle_url=${PADDLE_URL}
          if [ ${CUDA_VERSION} == "cu129" ]; then
            paddle_whl=paddlepaddle_gpu-0.0.0-cp${PYTHON_VERSION//./}-cp${PYTHON_VERSION//./}-linux_x86_64.whl
            paddle_url="${PADDLE_URL}${paddle_whl}"
          fi
          fleet_ops_wheel=paddlefleet_ops-0.0.0-cp${PYTHON_VERSION//./}-cp${PYTHON_VERSION//./}-linux_x86_64.whl
          wget "${paddlefleet_url}${CUDA_VERSION}/${fleet_ops_wheel}" -O ${fleet_ops_wheel}
          pip install ${fleet_ops_wheel} --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/  --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/${CUDA_VERSION}/ --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple
          echo "Install uv"
          export WITH_COVERAGE=ON
          pip install --upgrade pip
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          cd PaddleFleet
          git config --global --add safe.directory /paddle/PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git checkout ${fleet_branch}
          pip install colorlog>=6.10.1
          pip install -e . --no-build-isolation --index-url https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/ --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/${CUDA_VERSION}/ --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple
          if [ "${use_release}" == "true" ]; then
            echo "Using pre-built paddle package from develop branch."
            pip install ${paddle_url} --index-url=https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/ --force-reinstall --no-cache-dir
          fi
          pip install uv coverage==7.13.0 bce-python-sdk==0.8.74 wrapt matplotlib==3.10.8 pytest parameterized
          echo "Paddle Commit"
          python -c "import paddle; print(paddle.version.commit)"
          echo "PaddleFleet Commit"
          python -c "import paddlefleet; print(paddlefleet.version.commit)"
          export PYTHONPATH=/paddle/PaddleFleet:$PYTHONPATH
          bash ci/single_card_test.sh
          single_card_exit_code=$?
          if [[ "$single_card_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mSingle card test failed.\033[0m"
            exit 1
          else
            echo -e "\033[32mSingle card test succeeded.\033[0m"
          fi
          '

      - name: Single card sonic moe test
        if: matrix.python == '3.12' && matrix.cuda == '12.9' && always()
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xce '
          pwd
          source /root/proxy
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${{ matrix.python }}
          echo "Paddle Commit"
          python -c "import paddle; print(paddle.version.commit)"
          echo "PaddleFleet Commit"
          python -c "import paddlefleet; print(paddlefleet.version.commit)"
          cd PaddleFleet
          bash ci/single_card_sonic.sh
          single_card_exit_code=$?
          if [[ "$single_card_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mSingle card test failed.\033[0m"
            exit 1
          else
            echo -e "\033[32mSingle card test succeeded.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}

  multi-card_test:
    name: Unit test (multi-card)
    runs-on:
      group: Fleet-H-multi-card
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cuda: "12.6"
            python: "3.10"
          - cuda: "12.9"
            python: "3.10"
          - cuda: "13.0"
            python: "3.10"
          - cuda: "12.9"
            python: "3.11"
          - cuda: "12.9"
            python: "3.12"
          - cuda: "12.9"
            python: "3.13"
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      TASK: paddlefleet-CE-${{ matrix.cuda }}-${{ matrix.python }}-multi-card_test-release
    steps:
      - name: setup cuda and python
        run: |
          cuda=${{ matrix.cuda }}
          python_version=${{ matrix.python }}
          if [ "${cuda}" == "12.9" ]; then
            docker_image=${docker_image_cu129}
            cuda_version="cu129"
            paddle_url=${paddle_url_cu129}
          elif [ "${cuda}" == "13.0" ]; then
            docker_image=${docker_image_cu130}
            cuda_version="cu130"
            paddle_url=${paddle_url_cu130}
          else
            docker_image=${docker_image_cu126}
            cuda_version="cu126"
            paddle_url=${paddle_url_cu126}
          fi
          echo "DOCKER_IMAGE=${docker_image}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${cuda_version}" >> $GITHUB_ENV
          echo "PYTHON_VERSION=${python_version}" >> $GITHUB_ENV
          echo "PADDLE_URL=${paddle_url}" >> $GITHUB_ENV
      - name: Check docker image and run container
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          CUDA_VERSION: ${{ env.CUDA_VERSION }}
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          PADDLE_URL: ${{ env.PADDLE_URL }}
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull ${DOCKER_IMAGE}
          docker run -d -t --gpus all --name ${container_name} \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/paddle \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e PIP_CACHE_DIR \
            -e repo_flag="paddlefleet" \
            -e use_release \
            -e work_dir \
            -e CUDA_VERSION \
            -e PYTHON_VERSION \
            -e PADDLE_URL \
            -e paddlefleet_url \
            -e fleet_branch \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -w /paddle --network host ${DOCKER_IMAGE}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          rm -rf * .[^.]*
          source /root/proxy
          pip install --upgrade pip
          wget https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda -u
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          conda init bash
          conda create -n python${PYTHON_VERSION} python=${PYTHON_VERSION} -y
          conda activate python${PYTHON_VERSION}
          paddle_url=${PADDLE_URL}
          if [ ${CUDA_VERSION} == "cu129" ]; then
            paddle_whl=paddlepaddle_gpu-0.0.0-cp${PYTHON_VERSION//./}-cp${PYTHON_VERSION//./}-linux_x86_64.whl
            paddle_url="${PADDLE_URL}${paddle_whl}"
          fi
          fleet_ops_wheel=paddlefleet_ops-0.0.0-cp${PYTHON_VERSION//./}-cp${PYTHON_VERSION//./}-linux_x86_64.whl
          wget "${paddlefleet_url}${CUDA_VERSION}/${fleet_ops_wheel}" -O ${fleet_ops_wheel}
          pip install ${fleet_ops_wheel} --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/  --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/${CUDA_VERSION}/ --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple
          rm -rf ./*
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          git config --global --add safe.directory /paddle/PaddleFleet
          cd PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git submodule update --init --recursive
          git checkout ${fleet_branch}
          pip install colorlog>=6.10.1
          pip install -e . --no-build-isolation --index-url https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/ --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/${CUDA_VERSION}/ --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple
          if [ "${use_release}" == "true" ]; then
            echo "Using pre-built paddle package from develop branch."
            pip install ${paddle_url} --index-url=https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/ --force-reinstall --no-cache-dir
          fi
          pip install uv coverage==7.13.0 bce-python-sdk==0.8.74 wrapt pytest matplotlib==3.10.8
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          '

      - name: Multi-card test
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${PYTHON_VERSION}
          echo "Paddle Commit"
          python -c "import paddle; print(paddle.version.commit)"
          echo "PaddleFleet Commit"
          python -c "import paddlefleet; print(paddlefleet.version.commit)"
          export PYTHONPATH=/paddle/PaddleFleet:$PYTHONPATH
          bash PaddleFleet/ci/multi-card_test.sh
          multi_card_exit_code=$?
          if [[ "$multi_card_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mMulti card test failed.\033[0m"
            exit 1
          else
            echo -e "\033[32mMulti card test succeeded.\033[0m"
          fi
          '

      - name: Terminate and delete the container
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}


  integration-test-H20-single-card:
    name: Integration test (H20, single card)
    runs-on:
      group: Fleet-H-single-card
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - cuda: "12.6"
            python: "3.10"
          - cuda: "12.9"
            python: "3.10"
          - cuda: "13.0"
            python: "3.10"
          - cuda: "12.9"
            python: "3.11"
          - cuda: "12.9"
            python: "3.12"
          - cuda: "12.9"
            python: "3.13"
    env:
      PIP_CACHE_DIR: /home/.cache/pip
      CACHE_DIR: /home/.cache
      TASK: paddlefleet-CE-${{ matrix.cuda }}-${{ matrix.python }}-Release-integration-test-single-card-release
    steps:
      - name: Determine the runner
        run: |
          gpu_id=$(( $(echo $PWD | awk -F'/' '{print $3}' | awk -F'-' '{print $2}') - 1 ))
          cuda=${{ matrix.cuda }}
          python_version=${{ matrix.python }}
          echo GPU_DEVICES="$gpu_id" >> $GITHUB_ENV
          if [ "${cuda}" == "12.9" ]; then
            docker_image=${docker_image_cu129}
            cuda_version="cu129"
            paddle_url=${paddle_url_cu129}
          elif [ "${cuda}" == "13.0" ]; then
            docker_image=${docker_image_cu130}
            cuda_version="cu130"
            paddle_url=${paddle_url_cu130}
          else
            docker_image=${docker_image_cu126}
            cuda_version="cu126"
            paddle_url=${paddle_url_cu126}
          fi
          echo "DOCKER_IMAGE=${docker_image}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${cuda_version}" >> $GITHUB_ENV
          echo "PYTHON_VERSION=${python_version}" >> $GITHUB_ENV
          echo "PADDLE_URL=${paddle_url}" >> $GITHUB_ENV
          echo "BASE_NAME=${cuda_version}-${python_version}-H20" >> $GITHUB_ENV
      - name: Check docker image and run container
        env:
          GPU_DEVICES: ${{ env.GPU_DEVICES }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
          CUDA_VERSION: ${{ env.CUDA_VERSION }}
          PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          PADDLE_URL: ${{ env.PADDLE_URL }}
          BASE_NAME: ${{ env.BASE_NAME }}
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker pull ${DOCKER_IMAGE}
          set -x
          docker run -d -t --name ${container_name} --gpus "\"device=${GPU_DEVICES}\"" --shm-size=32G \
            -v "/dev/shm:/dev/shm"  \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}/../../..:/root \
            -v /ssd1/paddle-1/action_cache:/home/.cache \
            -v ${{ github.workspace }}:/workspace \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e PADDLE_ROOT \
            -e ci_scripts \
            -e CACHE_DIR \
            -e no_proxy \
            -e use_release \
            -e PIP_CACHE_DIR \
            -e CUDA_VERSION \
            -e PYTHON_VERSION \
            -e PADDLE_URL \
            -e BASE_NAME \
            -e paddlefleet_url \
            -e fleet_branch \
            -e formers_branch \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha }}" \
            -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
            -e GITHUB_REPO_NAME="${{ github.repository }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -w /workspace --network host ${DOCKER_IMAGE}

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          nvidia-smi
          rm -rf * .[^.]*
          source /root/proxy
          mkdir -p /home/.cache/pip
          pip cache dir
          pip install --upgrade pip
          wget https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda -u
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
          conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r
          conda init bash
          conda create -n python${PYTHON_VERSION} python=${PYTHON_VERSION} -y
          conda activate python${PYTHON_VERSION}
          fleet_ops_wheel=paddlefleet_ops-0.0.0-cp${PYTHON_VERSION//./}-cp${PYTHON_VERSION//./}-linux_x86_64.whl
          wget "${paddlefleet_url}${CUDA_VERSION}/${fleet_ops_wheel}" -O ${fleet_ops_wheel}
          pip install ${fleet_ops_wheel} --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/  --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/${CUDA_VERSION}/ --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple
          git clone https://github.com/PaddlePaddle/PaddleFleet.git
          cd PaddleFleet
          git config --global --add safe.directory /workspace/PaddleFleet
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          pip install colorlog>=6.10.1
          git checkout ${fleet_branch}
          pip install -e . --no-build-isolation --index-url https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/ --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/${CUDA_VERSION}/ --extra-index-url https://pypi.tuna.tsinghua.edu.cn/simple
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          '

      - name: Install PaddleFormers
        id: formers_install
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${PYTHON_VERSION}
          paddle_url=${PADDLE_URL}
          if [ ${CUDA_VERSION} == "cu129" ]; then
            paddle_whl=paddlepaddle_gpu-0.0.0-cp${PYTHON_VERSION//./}-cp${PYTHON_VERSION//./}-linux_x86_64.whl
            paddle_url="${PADDLE_URL}${paddle_whl}"
          fi
          if [ ${CUDA_VERSION} == "cu130" ]; then
            pip install blinker==1.9.0 --ignore-installed
          fi
          git clone https://github.com/PaddlePaddle/PaddleFormers.git
          cd PaddleFormers
          git config --global --add safe.directory /workspace/PaddleFormers
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git config pull.rebase false
          git checkout ${formers_branch}
          git log -1
          sed -i "s/from gpt_provider import GPTModelProvider/from paddleformers.transformers.gpt_provider import GPTModelProvider/g" examples/experiments/paddlefleet/glm45_provider.py
          sed -i "s/from gpt_provider import GPTModelProvider/from paddleformers.transformers.gpt_provider import GPTModelProvider/g" examples/experiments/paddlefleet/qwen_provider.py
          pip install -e . --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/
          if [ "${use_release}" == "true" ]; then
            echo "Using pre-built paddle package from develop branch."
            pip install ${paddle_url} --index-url=https://www.paddlepaddle.org.cn/packages/nightly/${CUDA_VERSION}/ --force-reinstall --no-cache-dir
          fi
          pip install uv coverage==7.13.0 bce-python-sdk==0.8.74 wrapt
          pip install bce-python-sdk==0.8.74
          pip install coverage==7.13.0
          pip install librosa==0.11.0
          echo "Paddle Commit"
          python -c "import paddle; print(paddle.version.commit)"
          echo "PaddleFleet Commit"
          python -c "import paddlefleet; print(paddlefleet.version.commit)"
          echo "paddleformers Commit"
          python -c "import paddleformers; print(paddleformers.version.commit)"
          '

      - name: Proprocess for integration test
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -ce '
          source /root/proxy
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${PYTHON_VERSION}
          bash -x PaddleFormers/tests/integration_test/preprocess.sh
          preprocess_exit_code=$?
          if [[ "$preprocess_exit_code" != "0" ]]; then
            echo -e "::error:: \033[31mPreprocess failed.\033[0m"
            exit 1
          else
            echo -e "\033[32mPreprocess succeeded.\033[0m"
          fi
          '

      - name: Integration test (GLM4.5 single-card)
        if: (success() || failure()) && steps.formers_install.conclusion == 'success'
