name: Precision update wheel

on:
  workflow_call:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-precision
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  publish-wheel:
    name: Publish wheel nightly (${{ matrix.CUDA_VERSION }})
    if: github.repository == 'PaddlePaddle/PaddleFleet'
    runs-on:
      group: cpu-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {CUDA_VERSION: CUDA12.9, IMAGE_TAG: cuda12.9-cudnn9.9-trt10.5-gcc11, bos_CUDA: cu129}
    env:
      TASK: PaddleFleet-nightly-${{ matrix.CUDA_VERSION }}
      PIP_CACHE_DIR: /root/.cache/pip
      CACHE_DIR: /root/.cache
      CCACHE_DIR: "/home/data/shared/.ccache/l1" # L1 cache on machine shared dir
      CCACHE_SECONDARY_STORAGE: "file:///home/data/cfs/.ccache/l2" # L2 cache on cfs
      CCACHE_MAXSIZE: 50G
      CCACHE_LIMIT_MULTIPLE: 0.8
      UV_HTTP_TIMEOUT: 600
      no_proxy: ".bcebos.com,bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"
    steps:
      - name: Check docker image and run container
        run: |
          docker_image="ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle_manylinux_devel:${{ matrix.IMAGE_TAG }}"
          docker pull $docker_image
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> ${{ github.env }}
          docker run -d -t --name ${container_name} \
            -v "/home/data/cfs:/home/data/cfs" \
            -v "/home/data/cfs/.cache:/root/.cache" \
            -v "/home/data/shared:/home/data/shared" \
            -v ${{ github.workspace }}/../../../proxy:/root/proxy \
            -v ${{ github.workspace }}:/workspace \
            -e no_proxy \
            -e CACHE_DIR \
            -e PIP_CACHE_DIR \
            -e CCACHE_DIR \
            -e CCACHE_SECONDARY_STORAGE \
            -e CCACHE_MAXSIZE \
            -e CCACHE_LIMIT_MULTIPLE \
            -e UV_HTTP_TIMEOUT \
            -e AK=${{ secrets.BOS_CREDENTIAL_AK }} \
            -e SK=${{ secrets.BOS_CREDENTIAL_SK }} \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e GITHUB_REPO_NAME=${{ github.repository }} \
            -w /workspace --network=host $docker_image

      - name: Install PaddleFleet
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xc '
          rm -rf * .[^.]*
          export LD_LIBRARY_PATH=/opt/_internal/cpython-3.10.0/lib/:${LD_LIBRARY_PATH}
          export PATH=/opt/_internal/cpython-3.10.0/bin/:${PATH}
          source /root/proxy
          git clone https://github.com/PaddlePaddle/PaddleFleet.git .
          git config --global --add safe.directory /workspace
          sed -i "s#packages/nightly/cu129#packages/nightly/${{ matrix.bos_CUDA }}#g" pyproject.toml
          cat pyproject.toml
          mkdir -p /root/.cache/pip
          pip cache dir
          pip install --upgrade pip
          pip install uv
          python -m pip install bce-python-sdk==0.8.74
          '

      - name: Build wheel
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xc '
          export LD_LIBRARY_PATH=/opt/_internal/cpython-3.10.0/lib/:${LD_LIBRARY_PATH}
          export PATH=/opt/_internal/cpython-3.10.0/bin/:${PATH}
          source /root/proxy
          git submodule update --init --recursive
          export UV_PYTHON="3.10"
          uv build --wheel --package paddlefleet --out-dir dist --clear -v
          uv build --wheel --package paddlefleet-ops --out-dir dist -v
          '
      - name: Upload wheel (and update precision)
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -xc '
          export LD_LIBRARY_PATH=/opt/_internal/cpython-3.10.0/lib/:${LD_LIBRARY_PATH}
          export PATH=/opt/_internal/cpython-3.10.0/bin/:${PATH}
          wget -q --no-proxy https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
          mkdir bos
          tar -xf bos_new.tar.gz -C bos
          cd dist
          python ../bos/BosClient.py paddlefleet-*.whl paddle-whl/nightly/${{ matrix.bos_CUDA }}/paddlefleet
          python ../bos/BosClient.py paddlefleet_ops-*.whl paddle-whl/nightly/${{ matrix.bos_CUDA }}/paddlefleet
          curl https://www.paddlepaddle.org.cn/inner/whl/update/path/new
          if [[ ${{ github.event_name }} == 'push' ]]; then
            export step="formers"
            export AK=${{ secrets.AK }}
            export SK=${{ secrets.SK }}
            export GITHUB_TOKEN=${{ github.token }}
            export COMMIT_ID=${{ github.sha }}
            cd /workspace
            source /root/proxy
            git clone https://github.com/PaddlePaddle/PaddleFormers.git
            bash -x /workspace/PaddleFormers/tests/integration_test/update_precision.sh
          fi
          '

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set +e
          docker exec -t ${{ env.container_name }} /bin/bash -c 'bash ci/clean_uv_cache.sh; rm -rf * .[^.]*'
          docker rm -f ${{ env.container_name }}
