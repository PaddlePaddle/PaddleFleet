  coverage_check:
    name: Coverage Upload And Check
    needs: [multi-card_test, single_card_test, integration-test-a100, integration-test-H20-multi-card, integration-test-H20-single-card, check-bypass]
    if: ${{ always() && needs.check-bypass.outputs.can-skip != 'true' && needs.single_card_test.result != 'skipped' }}
    runs-on:
      group: APPROVAL
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      GITHUB_REPO_NAME: ${{ github.repository }}
    steps:
      - name: Cleanup
        run: |
          rm -rf * .[^.]*
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: coverage file download
        shell: bash
        run: |
          coverage_configs="
          multi_coverage.xml:multi-card/coverage.xml
          single_coverage.xml:single-card/coverage.xml
          h20_multi_coverage.xml:h20-multi/coverage.xml
          h20_single_coverage.xml:h20-single/coverage.xml
          a100_coverage.xml:a100/coverage.xml
          "
          base_url="https://paddle-github-action.bj.bcebos.com/${GITHUB_REPO_NAME}/pull/${PR_ID}/${COMMIT_ID}"

          echo "$coverage_configs" | while IFS= read -r config; do
            if [ -n "$config" ]; then
                filename="${config%%:*}"
                filepath="${config#*:}"
                wget "${base_url}/${filepath}" -O "$filename" --no-proxy
            fi
          done
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD  --unified=0 > diff.txt
          echo "=== DIFF FILE ==="
          cat diff.txt
          echo "================="
          python -m pip install diff-cover
          echo "=== 覆盖率文件 ==="
          ls *.xml
          echo "================="
          COVERAGE_EXIT_CODE=0
          diff-cover *.xml --diff-file=diff.txt --fail-under=90 || COVERAGE_EXIT_CODE=9
          exit ${COVERAGE_EXIT_CODE}

      - name: Check full coverage
        if: always()
        run: |
          echo "=== 全量覆盖率检查 ==="
          python -m pip install coverage==7.13.0

          # 定义所有覆盖率文件
          COVERAGE_FILES=(
            "multi_coverage.xml"
            "single_coverage.xml"
            "h20_multi_coverage.xml"
            "h20_single_coverage.xml"
            "a100_coverage.xml"
          )

          # 检查哪些文件存在
          EXISTING_FILES=()
          for FILE in "${COVERAGE_FILES[@]}"; do
            if [ -f "$FILE" ]; then
              EXISTING_FILES+=("$FILE")
            fi
          done

          echo "找到 ${#EXISTING_FILES[@]} 个覆盖率文件"

          # 使用脚本合并 XML 覆盖率文件并输出全量覆盖率报告
          python ci/merge_and_check_coverage.py "${EXISTING_FILES[@]}" --report-only

      - name: filter coverage files and remove backup files
        if: always()
        run: |
          echo "=== CHECKING COVERAGE FILES ==="

          COVERAGE_FILES=(
            "multi_coverage.xml"
            "single_coverage.xml"
            "h20_multi_coverage.xml"
            "h20_single_coverage.xml"
            "a100_coverage.xml"
          )

          for COVERAGE_FILE in "${COVERAGE_FILES[@]}"; do
            python ci/filter_coverage.py "$COVERAGE_FILE" diff.txt
            BACKUP_FILE="${COVERAGE_FILE}.backup"
            if [ -f "$BACKUP_FILE" ]; then
              rm -f "$BACKUP_FILE"
              echo "Removed backup: $BACKUP_FILE"
            fi
          done

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: |
            ./multi_coverage.xml,
            ./single_coverage.xml,
            ./h20_multi_coverage.xml,
            ./h20_single_coverage.xml,
            ./h20_qwen_coverage.xml,
            ./a100_coverage.xml
          flags: coverage_combine
          name: "${{ env.TASK }}-${{ github.run_id }}"
          fail_ci_if_error: true
          use_oidc: true
          verbose: true

  unittest-gpu-ci:
    needs: [check-bypass, build_whl, check_documents_type]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' && needs.check_documents_type.outputs.is_md_only != 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-unittest-ci') }}
    name: unittest-gpu-ci
    runs-on: 'ernie-unittest'
    env:
      work_dir: ${{ github.workspace }}
      CI_JOB_NAME: unittest-gpu-ci
      TASK: PaddleFleet_CI_unittest_gpu_${{ github.event.pull_request.number || github.run_id }}
      IMAGE_NAME: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:cuda129-dev
      python_version: 3.12
      paddle_whl: https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-TagBuild-Training-Linux-Gpu-Cuda12.9-Cudnn9.9-Trt10.5-Mkl-Avx-Gcc11-SelfBuiltPypiUse/latest/paddlepaddle_gpu-0.0.0-cp312-cp312-linux_x86_64.whl
      PYTEST_EXECUTE_FLAG_FILE: ${{ github.workspace }}/../../../PYTEST_EXECUTE_FLAG_FILE/${{ github.event.pull_request.number || '0' }}/${{ github.event.pull_request.head.sha || github.sha }}/pytest_execute.flag
    outputs:
      pytest_execute_flag: ${{ steps.set_pytest_flag.outputs.pytest_execute_flag }}
    steps:
      - name: Determine the runner
        run: |
          gpu_id=$(( $(echo "$PWD" | awk -F'/' '{print $4}' | awk -F'_' '{print $2}') ))
          echo "GPU_DEVICES=$gpu_id" >> "$GITHUB_ENV"
      - name: Run Container
        env:
          FLAGS_dynamic_static_unified_comm: "True"
          PIP_CACHE_DIR: /root/.cache/pip
          GPU_DEVICES: ${{ env.GPU_DEVICES }}
        run: |
          work_dir="${{ github.workspace }}"
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> "$GITHUB_ENV"
          docker run -d -t --name "${container_name}" --gpus device="${GPU_DEVICES}" --runtime=nvidia --net=host \
            -v /dev/shm:/dev/shm --shm-size=32G \
            -v "${work_dir}/../../..:${work_dir}/../../.." \
            -v "${work_dir}:/workspace" \
            -v /home/.cache/:/root/.cache/ \
            -v /home/paddle-1/models/:/home/models/ \
            -e PF_HOME=/home/models/ \
            -e "work_dir=$work_dir" \
            -e "PR_ID=$PR_ID" \
            -e "BRANCH=$BRANCH" \
            -e "COMMIT_ID=$COMMIT_ID" \
            -e CUDA_VISIBLE_DEVICES="${GPU_DEVICES}" \
            -e NVIDIA_VISIBLE_DEVICES="${GPU_DEVICES}" \
            -e "PYTEST_EXECUTE_FLAG_FILE=$PYTEST_EXECUTE_FLAG_FILE" \
            -e "no_proxy=$no_proxy" \
            -e "paddle_whl=$paddle_whl" \
            -e "FLAGS_dynamic_static_unified_comm=$FLAGS_dynamic_static_unified_comm" \
            -e "python_version=$python_version" \
            -e "HF_PROXY_PATH=$work_dir/../../../proxy_huggingface" \
            -e "AISTUDIO_PROXY_PATH=$work_dir/../../../proxy_aistudio" \
            -e "HF_DATASETS_CACHE=$work_dir/../../../paddlenlp/huggingface/datasets" \
            -e "TRANSFORMERS_CACHE=$work_dir/../../../paddlenlp/huggingface/transformers" \
            -e PIP_CACHE_DIR \
            -w /workspace --privileged "${IMAGE_NAME}"
      - name: Download PaddleFleet build
        run: |
          work_dir="${{ github.workspace }}"
          docker exec -i -e "work_dir=$work_dir" "$container_name" /bin/bash <<-DOCKER_EOF
          rm -rf * .[^.]*
          mkdir PaddleFleet
          cd PaddleFleet
          wget -q --tries=5 --no-proxy --no-check-certificate \
            https://paddle-github-action.bj.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/${BRANCH}/paddlefleet.tar.gz
          tar -xf paddlefleet.tar.gz --strip-components=1
          git config --global --add safe.directory /workspace/PaddleFleet
          DOCKER_EOF
      - name: Change python version
        run: |
          docker exec -i \
            -e "work_dir=$work_dir" \
            -e "python_version=$python_version" \
            "$container_name" /bin/bash <<-DOCKER_EOF
          echo "Change python version to $python_version"
          set -e
          cp /home/models/Miniforge3-Linux-x86_64.sh /tmp/miniforge.sh
          bash /tmp/miniforge.sh -b -p /opt/conda
          /opt/conda/bin/conda create -n py_\$python_version python=\$python_version -y \
            --override-channels \
            -c conda-forge
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_\$python_version
          python --version
          DOCKER_EOF
      - name: Install test dependencies
        run: |
          work_dir="${{ github.workspace }}"
          docker exec -i \
            -e "work_dir=$work_dir" \
            -e "python_version=$python_version" \
            "$container_name" /bin/bash <<-DOCKER_EOF
          set -e
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_\$python_version
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          source \$work_dir/../../../proxy
          python -m pip uninstall paddlepaddle paddlepaddle_gpu paddlefleet -y
          cd /home/models/my_packages
          dpkg -i *.deb
          cd /workspace/PaddleFleet
          python -m pip install --upgrade pip
          python -m pip install dist/${{ needs.build_whl.outputs.root_whl_name }} \
            --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ \
            --extra-index-url=https://www.paddlepaddle.org.cn/packages/stable/cu129/
          python -m pip install dist/${{ needs.build_whl.outputs.ops_whl_name }} \
            --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ \
            --extra-index-url=https://www.paddlepaddle.org.cn/packages/stable/cu129/
          python -m pip install --group test-formers -i https://pypi.org/simple
          python -m pip install --no-deps "torch>=2.1,<2.11" -i https://pypi.org/simple
          python -c "import paddlefleet; print(paddlefleet.version.commit)"
          DOCKER_EOF
      - name: Test
        id: test
        run: |
          docker exec -t "$container_name" /bin/bash -c '
          . /opt/conda/etc/profile.d/conda.sh
          conda activate py_$python_version
          python --version
          ldconfig
          mkdir -p /root/.cache/pip
          rm -rf /root/.cache/aistudio/
          cd /workspace/PaddleFleet
          source $work_dir/../../../proxy
          source $work_dir/../../../AISTUDIO_ACCESS_TOKEN
          bash -x scripts/unit_test/ci_unittest.sh \
            ${paddle_whl} false ${PYTEST_EXECUTE_FLAG_FILE}
          '
      - name: Display Test Summary
        if: always()
        run: |
          file_success=${{ github.workspace }}/PaddleFleet/unittest_logs/unittest.log
          file_failed=${{ github.workspace }}/PaddleFleet/unittest_logs/unittest_FAIL.log
          if [[ "${{ steps.test.outcome }}" == "success" ]]; then
            echo "Test passed successfully"
            tail -n 1 "${file_success}" || true
          else
            echo "Test failed with status: ${{ steps.test.outcome }}"
            grep "^FAILED test/formers" "${file_failed}" | awk '{print $2}' | sort -u || true
          fi
      - name: Upload Products
        if: always()
        env:
          home_path: ${{ github.workspace }}/../../..
          bos_file: ${{ github.workspace }}/../../../bos/BosClient.py
          java_file: ${{ github.workspace }}/../../../jdk1.8.0_351
          allure_file: ${{ github.workspace }}/../../../allure-2.19.0/bin/allure
        run: |
          docker exec -t "$container_name" /bin/bash -c '
          source ${work_dir}/../../../proxy_huggingface
          python -m pip install bce-python-sdk==0.8.74 -i https://pypi.org/simple
          if [ ! -f "${{ env.bos_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
            mkdir -p ${{ env.home_path }}/bos
            tar xf ${{ env.home_path }}/bos_new.tar.gz -C ${{ env.home_path }}/bos
          fi
          if [ ! -f "${{ env.java_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/java_linux.tar.gz https://paddle-qa.bj.bcebos.com/java/java_linux.tar.gz --no-check-certificate
            tar xf ${{ env.home_path }}/java_linux.tar.gz -C ${{ env.home_path }}
          fi
          if [ ! -f "${{ env.allure_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/allure-2.19.0.zip https://xly-devops.bj.bcebos.com/tools/allure-2.19.0.zip --no-check-certificate
            unzip -q ${{ env.home_path }}/allure-2.19.0.zip -d ${{ env.home_path }}
          fi
          bos_prefix="${PR_ID}/${COMMIT_ID}"
          cd /workspace/PaddleFleet
          if [ -f "${PYTEST_EXECUTE_FLAG_FILE}" ] && [ -f coverage.xml ]; then
            python ${{ env.bos_file }} coverage.xml paddle-github-action/PR/PaddleFleet/ci-unittest-gpu/${bos_prefix}/logs
            echo "coverage: https://paddle-github-action.bj.bcebos.com/PR/PaddleFleet/ci-unittest-gpu/${bos_prefix}/logs/coverage.xml"
          fi
          cd /workspace/PaddleFleet/unittest_logs
          for FILE in *; do
            [ -f "$FILE" ] || continue
            python ${{ env.bos_file }} "$FILE" paddle-github-action/PR/PaddleFleet/ci-unittest-gpu/${bos_prefix}/logs
            echo "$FILE: https://paddle-github-action.bj.bcebos.com/PR/PaddleFleet/ci-unittest-gpu/${bos_prefix}/logs/$FILE"
          done
          cd /workspace/PaddleFleet
          export JAVA_HOME="${{ env.java_file }}"
          export JRE_HOME="${JAVA_HOME}/jre"
          export CLASSPATH="${JAVA_HOME}/lib"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          if [ -d result ]; then
            ${{ env.allure_file }} generate result -o report
            tar -czf report.tar.gz report
            python ${{ env.bos_file }} report.tar.gz paddle-github-action/PR/PaddleFleet/ci-unittest-gpu/${bos_prefix}/logs
            echo "report: https://paddle-github-action.bj.bcebos.com/PR/PaddleFleet/ci-unittest-gpu/${bos_prefix}/logs/report.tar.gz"
          fi
          '
      - name: Set pytest execute flag output
        if: always()
        id: set_pytest_flag
        run: |
          if [ -f "${{ env.PYTEST_EXECUTE_FLAG_FILE }}" ]; then
            echo "pytest_execute_flag=true" >> "$GITHUB_OUTPUT"
          else
            echo "pytest_execute_flag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Terminate And Delete the Container
        if: always()
        run: |
          docker rm -f "$container_name" 2>/dev/null || true

  upload-unittest-coverage:
    name: upload-unittest-coverage
    needs: [unittest-gpu-ci]
    if: ${{ always() && needs.unittest-gpu-ci.outputs.pytest_execute_flag == 'true' }}
    runs-on: 'ernie-cpu'
    steps:
      - name: Download coverage.xml
        run: |
          bos_prefix="${PR_ID}/${COMMIT_ID}"
          wget -q --no-proxy --no-check-certificate \
            "https://paddle-github-action.bj.bcebos.com/PR/PaddleFleet/ci-unittest-gpu/${bos_prefix}/logs/coverage.xml" \
            -O coverage.xml
      - name: Fix coverage.xml paths
        run: |
          old_source=$(grep -oPm1 '(?<=<source>).*?(?=</source>)' coverage.xml || true)
          if [ -n "$old_source" ]; then
            sed -i "s|<source>$old_source</source>|<source>src/paddlefleet</source>|g" coverage.xml
          else
            sed -i 's|<sources>|<sources>\n        <source>src/paddlefleet</source>|' coverage.xml
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  model-unittest-gpu-ci:
    needs: [check-bypass, build_whl, check_documents_type]
    if: ${{ needs.check-bypass.outputs.can-skip != 'true' && needs.check_documents_type.outputs.is_md_only != 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-models-ci') }}
    name: model-unittest-gpu-ci
    runs-on: 'ernie-8gpu'
    env:
      work_dir: ${{ github.workspace }}
      CI_JOB_NAME: model-unittest-gpu-ci
      TASK: PaddleFleet_CI_model_unittest_gpu_${{ github.event.pull_request.number || github.run_id }}
      IMAGE_NAME: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddle:ubuntu24-cuda129-py312-dev
      python_version: 3.12
      paddle_whl: https://paddle-qa.bj.bcebos.com/paddle-pipeline/Develop-TagBuild-Training-Linux-Gpu-Cuda12.9-Cudnn9.9-Trt10.5-Mkl-Avx-Gcc11-SelfBuiltPypiUse/latest/paddlepaddle_gpu-0.0.0-cp312-cp312-linux_x86_64.whl
    steps:
      - name: Run Container
        env:
          FLAGS_dynamic_static_unified_comm: "True"
          PIP_CACHE_DIR: /root/.cache/pip
        run: |
          work_dir="${{ github.workspace }}"
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> "$GITHUB_ENV"
          DOCKER_VER=$(docker version --format '{{.Server.Version}}' | cut -d. -f1,2)
          if (( $(echo "$DOCKER_VER < 19.03" | bc -l) )); then
            GPU_OPTION="--runtime=nvidia"
          else
            GPU_OPTION="--gpus all"
          fi
          echo "DOCKER_VER=${DOCKER_VER}"
          echo "GPU_OPTION=${GPU_OPTION}"
          docker run -d -t ${GPU_OPTION} --name ${container_name} --net=host -v /dev/shm:/dev/shm --shm-size=32G \
            -v ${work_dir}/../../..:${work_dir}/../../.. \
            -v ${work_dir}:/workspace \
            -v /home/.cache/:/root/.cache/ \
            -v /home/paddle-1/models/:/home/models/ \
            -e "work_dir=$work_dir" \
            -e "PR_ID=$PR_ID" \
            -e "BRANCH=$BRANCH" \
            -e "COMMIT_ID=$COMMIT_ID" \
            -e "no_proxy=$no_proxy" \
            -e "CI_JOB_NAME=$CI_JOB_NAME" \
            -e "python_version=$python_version" \
            -e "paddle_whl=$paddle_whl" \
            -e "FLAGS_dynamic_static_unified_comm=$FLAGS_dynamic_static_unified_comm" \
            -e HF_PROXY_PATH=${work_dir}/../../../proxy_huggingface \
            -e AISTUDIO_PROXY_PATH=${work_dir}/../../../proxy_aistudio \
            -e PF_HOME=/home/models/ \
            -e PIP_CACHE_DIR \
            -w /workspace --privileged ${IMAGE_NAME}
      - name: Install PaddleFleet
        run: |
          work_dir="${{ github.workspace }}"
          docker exec -i \
            -e "work_dir=$work_dir" \
            -e "python_version=$python_version" \
            "$container_name" /bin/bash <<-DOCKER_EOF
          set -e
          python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          python --version
          rm -rf * .[^.]*
          mkdir PaddleFleet && cd PaddleFleet
          wget -q --tries=5 --no-proxy --no-check-certificate https://paddle-github-action.bj.bcebos.com/PaddleFleet/PR/${PR_ID}/${COMMIT_ID}/${BRANCH}/paddlefleet.tar.gz
          tar -xf paddlefleet.tar.gz --strip-components=1
          git config --global --add safe.directory /workspace/PaddleFleet
          python -m pip install dist/${{ needs.build_whl.outputs.root_whl_name }} --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --extra-index-url=https://www.paddlepaddle.org.cn/packages/stable/cu129/
          python -m pip install dist/${{ needs.build_whl.outputs.ops_whl_name }} --extra-index-url=https://www.paddlepaddle.org.cn/packages/nightly/cu129/ --extra-index-url=https://www.paddlepaddle.org.cn/packages/stable/cu129/
          python -m pip install --group test-formers -i https://pypi.org/simple
          python -m pip install --no-deps "torch>=2.1,<2.11" -i https://pypi.org/simple
          python -c "import pytest; import paddle; import paddlefleet; import paddlefleet_ops; print(paddle.version.commit); print(paddlefleet.version.commit)"
          DOCKER_EOF
      - name: Determine trigger mode
        id: trigger_mode
        env:
          COMMENT_BODY: ${{ github.event.issue.comment.body }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          UPDATE_BASELINE_MODELS="false"
          MODE="pr"
          PR_NUMBER="${PR_ID}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="manual"
            UPDATE_BASELINE_MODELS="${{ github.event.inputs.update_baseline_models }}"
            PR_NUMBER=0
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE="schedule"
            UPDATE_BASELINE_MODELS="false"
            PR_NUMBER=0
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            # Parse comment for [update-baseline: models]
            if grep -qE '\[update-baseline:[[:space:]]*[a-zA-Z0-9_,]+\]' <<< "$COMMENT_BODY"; then
              UPDATE_BASELINE_MODELS=$(grep -oE '\[update-baseline:[[:space:]]*([a-zA-Z0-9_,]+)\]' <<< "$COMMENT_BODY" | sed 's/.*\[\(.*\)\].*/\1/' | sed 's/update-baseline:[[:space:]]*//g')
              MODE="comment"
              PR_NUMBER="${{ github.event.issue.number }}"
              echo "Detected baseline update from comment: $UPDATE_BASELINE_MODELS"
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Parse PR description for [update-baseline: models]
            if grep -qE '\[update-baseline:[[:space:]]*[a-zA-Z0-9_,]+\]' <<< "$PR_BODY"; then
              UPDATE_BASELINE_MODELS=$(grep -oE '\[update-baseline:[[:space:]]*([a-zA-Z0-9_,]+)\]' <<< "$PR_BODY" | sed 's/.*\[\(.*\)\].*/\1/' | sed 's/update-baseline:[[:space:]]*//g')
              MODE="pr"
              echo "Detected baseline update from PR description: $UPDATE_BASELINE_MODELS"
            fi
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "update_baseline_models=$UPDATE_BASELINE_MODELS" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Test
        id: test
        run: |
          # Use step outputs from previous step instead of env vars
          MODE="${{ steps.trigger_mode.outputs.mode }}"
          UPDATE_BASELINE_MODELS="${{ steps.trigger_mode.outputs.update_baseline_models }}"
          PR_NUMBER="${{ steps.trigger_mode.outputs.pr_number }}"
          BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          docker exec -i \
            -e python_version="$python_version" \
            -e work_dir="$work_dir" \
            -e MODE="$MODE" \
            -e UPDATE_BASELINE_MODELS="$UPDATE_BASELINE_MODELS" \
            -e PR_NUMBER="$PR_NUMBER" \
            -e BRANCH="$BRANCH" \
            -e SKIP_INSTALL_REQUIREMENTS=true \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            $container_name /bin/bash <<-DOCKER_EOF
          python --version
          ldconfig
          mkdir -p /root/.cache/pip
          pip cache dir
          set -e
          rm -rf /root/.cache/aistudio/
          cd /workspace/PaddleFleet && git config --global --add safe.directory $PWD
          echo "=== Trigger Mode: ${MODE} ==="
          echo "Update baseline: ${UPDATE_BASELINE_MODELS}"
          echo "BRANCH: ${BRANCH}"
          echo "PR number: ${PR_NUMBER}"
          bash -x scripts/regression/ci_model_unittest.sh True False "$UPDATE_BASELINE_MODELS" $BRANCH ${PR_NUMBER}
          DOCKER_EOF
      - name: Display Test Summary
        if: always()
        run: |
          file_success=${{ github.workspace }}/PaddleFleet/model_unittest_logs/model_unittest.log
          file_failed=${{ github.workspace }}/PaddleFleet/model_unittest_logs/model_unittest_FAIL.log
          if [[ "${{ steps.test.outcome }}" == "success" ]]; then
            echo "✅ Test passed successfully"
            tail -n 1 ${file_success} || true
          else
            echo "❌ Test failed with status: ${{ steps.test.outcome }}"
            grep "^FAILED scripts/regression" ${file_failed} | awk '{print $2}' | sort -u || true
          fi
      - name: Upload Products
        if: always()
        env:
          home_path: ${{ github.workspace }}/../../..
          bos_file: ${{ github.workspace }}/../../../bos/BosClient.py
          java_file: ${{ github.workspace }}/../../../jdk1.8.0_351
          allure_file: ${{ github.workspace }}/../../../allure-2.19.0/bin/allure
          MODE: ${{ steps.trigger_mode.outputs.mode }}
          PR_NUMBER: ${{ steps.trigger_mode.outputs.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          docker exec -t $container_name /bin/bash -c '
          source ${work_dir}/../../../proxy_huggingface
          python -m pip install bce-python-sdk==0.8.74 -i https://pypi.org/simple
          if [ ! -f "${{ env.bos_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
            mkdir ${{ env.home_path }}/bos
            tar xf ${{ env.home_path }}/bos_new.tar.gz -C ${{ env.home_path }}/bos
          fi
          if [ ! -f "${{ env.java_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/java_linux.tar.gz https://paddle-qa.bj.bcebos.com/java/java_linux.tar.gz --no-check-certificate
            tar xf ${{ env.home_path }}/java_linux.tar.gz
          fi
          if [ ! -f "${{ env.allure_file }}" ]; then
            wget -q --no-proxy -O ${{ env.home_path }}/allure-2.19.0.zip https://xly-devops.bj.bcebos.com/tools/allure-2.19.0.zip --no-check-certificate
            unzip -q ${{ env.home_path }}/allure-2.19.0.zip
          fi

          MODE=${{ env.MODE }}
          if [[ "$MODE" == "pr" ]]; then
            bos_prefix="${PR_ID}/${COMMIT_ID}"
          elif [[ "$MODE" == "comment" ]]; then
            bos_prefix="${{ env.PR_NUMBER }}/comment_${{ env.RUN_ID }}"
          else
            bos_prefix="${MODE}/${{ env.RUN_ID }}"
          fi

          # logs
          cd /workspace/PaddleFleet/model_unittest_logs
          for FILE in /workspace/PaddleFleet/model_unittest_logs/*; do
            file=$(basename "$FILE")
            python ${{ env.bos_file }} $file paddle-github-action/PR/PaddleFleet/ci-model-unittest-gpu/${bos_prefix}/logs
            exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "$file: https://paddle-github-action.bj.bcebos.com/PR/PaddleFleet/ci-model-unittest-gpu/${bos_prefix}/logs/$file"
            else
              echo "ERROR: Failed to upload $file (exit code: $exit_code)"
            fi
          done

          # allure
          cd /workspace/PaddleFleet/
          export JAVA_HOME="${{ env.java_file }}"
          export JRE_HOME="${JAVA_HOME}/jre"
          export CLASSPATH="${JAVA_HOME}/lib"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          ${{ env.allure_file }} generate result -o report
          tar -czf report.tar.gz report
          python ${{ env.bos_file }} report.tar.gz paddle-github-action/PR/PaddleFleet/ci-model-unittest-gpu/${bos_prefix}/logs
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "report: https://paddle-github-action.bj.bcebos.com/PR/PaddleFleet/ci-model-unittest-gpu/${bos_prefix}/logs/report.tar.gz"
          else
            echo "ERROR: Failed to upload report.tar.gz (exit code: $exit_code)"
          fi
          '
      - name: Terminate And Delete the Container
        if: always()
        run: |
          docker rm -f $container_name 2>/dev/null || true
