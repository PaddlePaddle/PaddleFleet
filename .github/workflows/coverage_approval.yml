name: Coverage Approval

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  signal:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'swgu98' &&
      contains(toLower(github.event.review.body), 'lgtm') &&
      contains(toLower(github.event.review.body), 'coverage')
    runs-on:
      group: APPROVAL

    steps:
      - name: Record coverage approval
        run: |
          echo "Review state: ${{ github.event.review.state }}"
          echo "Reviewer: ${{ github.event.review.user.login }}"
          echo "Review body: ${{ github.event.review.body }}"
          echo "Pull request: ${{ github.event.pull_request.number }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha }}"