name: Require PR Description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, release/*]

jobs:
  check-pr-description:
    name: Check PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR description is empty
        id: check-description
        # 使用 GitHub Actions 的内置上下文检查 PR 内容
        run: |
          DESCRIPTION=$(echo "${{ github.event.pull_request.body }}" | tr -d '\n\r' | xargs)

          if [ -z "$DESCRIPTION" ]; then
            echo "❌ PR 描述为空，请补充说明本次更改的目的和内容。"
            echo "::error title=缺少PR描述::请在此 Pull Request 的「Description」区域填写更改说明，例如：%0A%0A- **更改目的**：修复了什么 bug？增加了什么功能？%0A- **测试说明**：如何验证此更改有效？%0A- **相关 Issue**：关联的 Issue 编号（如有）"
            exit 1
          else
            echo "✅ PR 描述符合要求。"
            echo "字数统计: ${#DESCRIPTION} 个字符"
          fi
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check uv.lock is not deleted
        run: |
          git diff --name-status origin/${{ github.base_ref }}...HEAD | tee changed_files.txt
          if cat changed_files.txt | grep -q "^D.*uv\.lock"; then
            echo "::error::uv.lock cannot be deleted in this PR"
            exit 1
          elif cat changed_files.txt | grep -q "^R.*uv\.lock"; then
            echo "::error::uv.lock cannot be renamed in this PR"
            exit 1
          fi
          echo "uv.lock is intact"
      - name: Check ops_required_version.txt is bumped when packages/ is modified
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          PACKAGES_CHANGED=$(echo "$CHANGED" | grep -c "^packages/" || true)
          VERSION_CHANGED=$(echo "$CHANGED" | grep -c "^ops_required_version\.txt$" || true)

          if [ "$PACKAGES_CHANGED" -gt 0 ] && [ "$VERSION_CHANGED" -eq 0 ]; then
            echo "::error title=需要更新 ops_required_version.txt::检测到 packages/ 目录下有文件改动，但 ops_required_version.txt 未同步更新。"
            echo ""
            echo "请将 ops_required_version.txt 中的版本号 +1，例如："
            echo "  1 → 2"
            exit 1
          fi
          echo "✅ ops_required_version.txt 检查通过。"
