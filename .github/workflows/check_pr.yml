name: Require PR Description

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [develop, release/*]

jobs:
  check-pr-description:
    name: Check PR Description
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR description is empty
        id: check-description
        # 使用 GitHub Actions 的内置上下文检查 PR 内容
        run: |
          python ci/checkPRTemplate.py
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check uv.lock is not deleted
        run: |
          git diff --name-status origin/${{ github.base_ref }}...HEAD | tee changed_files.txt
          if cat changed_files.txt | grep -q "^D.*uv\.lock"; then
            echo "::error::uv.lock cannot be deleted in this PR"
            exit 1
          elif cat changed_files.txt | grep -q "^R.*uv\.lock"; then
            echo "::error::uv.lock cannot be renamed in this PR"
            exit 1
          fi
          echo "uv.lock is intact"
