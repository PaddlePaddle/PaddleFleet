name: 'single case'
description: '单卡测试用例'

inputs:
  docker_name:
    description: 'Docker容器名称'
    required: true
    type: string
  multi_python_version:
    description: '多Python版本'
    required: false
    default: ''
    type: string
  case_base_name:
    description: '测试用例基础名称'
    required: true
    type: string
  formers_install_status:
    description: 'PaddleFormers安装状态'
    required: true
    default: 'success'
    type: string

runs:
  using: "composite"
  steps:
    - name: Single Card Tests
      run: |
        echo "========================================"
        echo "Starting single card test suite"
        echo "========================================"
      shell: bash

    - name: Preprocess for integration test
      if: always() && inputs.formers_install_status == 'success'
      run: |
        echo "::group::Preprocess logs"
        echo ">>> Running preprocess <<<"
        docker exec -t ${{ inputs.docker_name }} /bin/bash -c '
        source /root/proxy
        if [[ -n "${{ inputs.multi_python_version }}" ]]; then
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${{ inputs.multi_python_version }}
        fi
        bash -x PaddleFormers/tests/integration_test/preprocess.sh
        '
        if [ $? -eq 0 ]; then
          echo ">>> Preprocess completed <<<"
        else
          echo ">>> Preprocess failed <<<"
          exit 1
        fi
        echo "::endgroup::"
      shell: bash

    - name: Integration test (GLM4.5 single-card)
      if: always() && inputs.formers_install_status == 'success'
      run: |
        echo "::group::GLM4.5 test logs"
        echo ">>> Running GLM4.5 single-card test <<<"
        docker exec -t ${{ inputs.docker_name }} /bin/bash -c '
        source /root/proxy
        if [[ -n "${{ inputs.multi_python_version }}" ]]; then
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${{ inputs.multi_python_version }}
        fi
        export BASE_NAME=${{ inputs.case_base_name }}
        export CASE_NAME=glm45_single_card.txt
        bash -x PaddleFormers/tests/integration_test/glm45_pt_single_card.sh
        exit_code=$?
        if [ $exit_code -ne 0 ]; then
          echo "GLM4.5 single-card test failed, checking precision..."
          bash -x PaddleFleet/ci/ce_check_precision.sh $CASE_NAME $BASE_NAME
        fi
        '
        if [ $? -eq 0 ]; then
          echo ">>> GLM4.5 test completed <<<"
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo ">>> GLM4.5 test failed <<<"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "::endgroup::"
      shell: bash

    - name: Integration test (Qwen3-30B-A3B single-card)
      if: always() && inputs.formers_install_status == 'success'
      run: |
        echo "::group::Qwen3 test logs"
        echo ">>> Running Qwen3 single-card test <<<"
        docker exec -t ${{ inputs.docker_name }} /bin/bash -c '
        source /root/proxy
        if [[ -n "${{ inputs.multi_python_version }}" ]]; then
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${{ inputs.multi_python_version }}
        fi
        export BASE_NAME=${{ inputs.case_base_name }}
        export CASE_NAME=qwen3_single_card.txt
        bash -x PaddleFormers/tests/integration_test/qwen3_single_card.sh
        exit_code=$?
        if [ $exit_code -ne 0 ]; then
          echo "Qwen3 single-card test failed, checking precision..."
          bash -x PaddleFleet/ci/ce_check_precision.sh $CASE_NAME $BASE_NAME
        fi
        '
        if [ $? -eq 0 ]; then
          echo ">>> Qwen3 test completed <<<"
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo ">>> Qwen3 test failed <<<"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "::endgroup::"
      shell: bash

    - name: Qwen3-vl-8k-single-card
      if: always() && inputs.formers_install_status == 'success'
      run: |
        echo "::group::Qwen3-vl test logs"
        echo ">>> Running Qwen3-vl-8k single-card test <<<"
        docker exec -t ${{ inputs.docker_name }} /bin/bash -c '
        source /root/proxy
        if [[ -n "${{ inputs.multi_python_version }}" ]]; then
          source "$HOME/miniconda/etc/profile.d/conda.sh"
          conda activate python${{ inputs.multi_python_version }}
        fi
        export BASE_NAME=${{ inputs.case_base_name }}
        export CASE_NAME=qwen3vl_sft_single_card.txt
        timeout 5m bash -x PaddleFormers/tests/integration_test/qwen3vl_sft_single_card.sh single
        exit_code=$?
        if [ $exit_code -ne 0 ]; then
          echo "Qwen3-vl-8k-single-card test failed, checking precision..."
          bash -x PaddleFleet/ci/ce_check_precision.sh $CASE_NAME $BASE_NAME
        fi
        '
        if [ $? -eq 0 ]; then
          echo ">>> Qwen3-vl test completed <<<"
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo ">>> Qwen3-vl test failed <<<"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "::endgroup::"
      shell: bash
    - name: 📊 Test Summary
      if: always()
      run: |
        echo "============================================"
        echo "          SINGLE CARD TEST SUMMARY"
        echo "============================================"

        # 获取各步骤状态
        GLM45_STATUS="${{ steps.glm45.outputs.status }}"
        QWEN3_STATUS="${{ steps.qwen3.outputs.status }}"
        QWEN3VL_STATUS="${{ steps.qwen3vl.outputs.status }}"

        # 如果没有执行（条件不满足），标记为 skipped
        [ -z "$GLM45_STATUS" ] && GLM45_STATUS="skipped"
        [ -z "$QWEN3_STATUS" ] && QWEN3_STATUS="skipped"
        [ -z "$QWEN3VL_STATUS" ] && QWEN3VL_STATUS="skipped"

        # 打印表格
        printf "| %-25s | %-10s |\n" "Test Phase" "Status"
        printf "|---------------------------|------------|\n"
        printf "| %-25s | %-10s |\n" "GLM4.5 single-card" "${GLM45_STATUS}"
        printf "| %-25s | %-10s |\n" "Qwen3 single-card" "${QWEN3_STATUS}"
        printf "| %-25s | %-10s |\n" "Qwen3-vl-8k single-card" "${QWEN3VL_STATUS}"

        echo "============================================"

        # 计算通过/失败统计
        TOTAL=0
        PASSED=0
        FAILED=0
        SKIPPED=0

        for status in "$GLM45_STATUS" "$QWEN3_STATUS" "$QWEN3VL_STATUS"; do
          if [ "$status" != "skipped" ]; then
            TOTAL=$((TOTAL + 1))
            if [ "$status" = "success" ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          else
            SKIPPED=$((SKIPPED + 1))
          fi
        done

        echo ""
        echo "📊 Statistics:"
        echo "   Total executed: $TOTAL"
        echo "   ✅ Passed: $PASSED"
        echo "   ❌ Failed: $FAILED"
        echo "   ⏭️  Skipped: $SKIPPED"
        echo ""

        # 最终结果
        if [ $FAILED -gt 0 ]; then
          echo "❌ TEST SUITE FAILED: $FAILED test(s) failed"
          echo "============================================"
          exit 1
        elif [ $TOTAL -eq 0 ]; then
          echo "⚠️  TEST SUITE SKIPPED: No tests were executed"
          echo "============================================"
        else
          echo "✅ TEST SUITE PASSED: All $PASSED test(s) passed"
          echo "============================================"
        fi
      shell: bash
