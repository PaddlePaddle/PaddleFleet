### data
train_dataset_type: erniekit
eval_dataset_type: erniekit
train_dataset_path: /root/.cache/PaddleFormers/alignment_paddle.jsonl
train_dataset_prob: "1.0"
eval_dataset_path: /root/.cache/PaddleFormers/alignment_paddle.jsonl
max_seq_len: 8192
packing: false
padding_free: true
mix_strategy: random
template_backend: custom
template: kimi_k2
truncation_strategy: right
dataloader_num_workers: 1
dataset_num_proc: 1

### model
model_name_or_path: /root/.cache/PaddleFormers/Kimi-K2-bf16_2EP
_attn_implementation: flashmask
high_precision_rope: true

### finetuning
stage: SFT
fine_tuning: full
seed: 23
do_train: true
do_eval: false
per_device_eval_batch_size: 1
per_device_train_batch_size: 1
num_train_epochs: 1
# 单 step md5 对齐：监控用例固定单 step（step1 前向 loss），只校验首个 step；
# 多 step 反向的 bf16 累加差异（bf16 精度极限）会被严格 md5 判为不一致。
# 注：2 卡 EP2 配置的 step1 md5 基线需首次 smoke 后确立（此前 bit-exact 结论来自 8 卡 TP8/EP8）。
max_steps: 1
eval_steps: 200
evaluation_strategy: steps
save_steps: 300
save_strategy: steps
logging_steps: 1
gradient_accumulation_steps: 1
logging_dir: ./logs/paddle/default/vdl
output_dir: ./logs/paddle/default/trainer
disable_tqdm: true
eval_accumulation_steps: 16

# train - 与 MG 对齐
warmup_steps: 0
learning_rate: 1.0e-5

# performance - 单机 2 卡 TP=1 / EP=2 / PP=1 与 MG 对齐
tensor_model_parallel_size: 1
sequence_parallel: false
pipeline_model_parallel_size: 1
expert_model_parallel_size: 2
use_expert_parallel: true
sharding: stage1
recompute_granularity: "full"
recompute_method: uniform
recompute_num_layers: 1
bf16: true
fp16_opt_level: O2
unified_checkpoint: false
save_checkpoint_format: flex_checkpoint
load_checkpoint_format: flex_checkpoint
continue_training: true
tensorwise_offload_optimizer: true

# 精度对齐锚点：打印 per_token_loss / final_loss 的 md5，供 compare_loss.py 逐 step 比对
use_accuracy_compatible: true
max_grad_norm: 0.0
